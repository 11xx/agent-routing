# The fixed invariants bin/check-change runs on every change. It reads this
# list from the change's base and adds the candidate's entries under new
# names, so a change cannot drop the invariant that covers what it breaks.
# Their combined limit is 3 seconds; measure it when adding an entry.

# The catalog, policy and notes validate and are in canonical form.
[[invariant]]
name = "lint-routing"
command = "bin/lint-routing"

# No catalog model id, alias or backend model string appears in code,
# templates or tests.
[[invariant]]
name = "roster-ids"
command = "bin/lint-roster-ids"

# Every revision preserves the bytes of all earlier field evidence.
[[invariant]]
name = "notes-grow-only"
command = 'bin/check-notes-growth --base "$AGENT_ROUTING_CHECK_BASE"'
