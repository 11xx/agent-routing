# Named delegation routes. Callers choose a task-shape profile; this table
# deterministically supplies the current provider, model, and effort.
# Access without a path: `agent-routing profiles`.
#
# No profile routes to the OpenCode backend. The provider declares no model
# variants, so effort is unreachable there by any syntax: a model reference
# carrying one is refused with `Variant unavailable`, and the same tiers
# declared through the runtime plugin and through a static provider block both
# failed to reach the resolver. A route that names an effort the backend
# silently drops is a route that lies about what ran, so `agent-delegate`
# refuses one rather than downgrading it — which left every OpenCode route
# here unrunnable. Pi reaches the same models and honours effort, so it
# carries the capacity these variants were offering.
#
# Reinstate them if the provider starts declaring variants: add the variant
# back with `backends = ["opencode"]`, and confirm the effort actually arrives
# by checking that reasoning-token counts move with the lever rather than by
# trusting the flag was accepted. The OpenCode backend also has no
# unattended-approval mode, so a permission prompt ends a non-interactive run
# with exit 0 and no verdict; that limitation is independent of variants and
# has to be solved separately before an unattended route is safe.

[meta]
schema = "routing-profiles/1"
updated = "2026-11-09"

# Pi routes to DeepSeek V4.1 Flash on the OpenCode Go pool by operator
# direction: the GPT profiles name the codex backend alone, and a
# `deepseek-go` variant is pi's default for each of them. The row carries the
# evidence and the caveats. The Go catalog names the build
# `deepseek-v4.1-flash`, hence the explicit backend model, and the Go route
# runs only while the workspace's data-residency opt-in is on.

# `escalation_sources` names the profiles whose seats a directed selection
# under this shape may borrow and stay stable; the profile itself is always
# implied. Read-only shapes borrow from read-only shapes and `implement` from
# `execute`; `design` borrows nothing, because read-only judgment is not the
# taste axis it needs.

[admission]
max_age_seconds = 300

[admission.review]
codex_author_families = ["openai", "gpt-5.6", "gpt-5.5"]
codex_review_backend = "claude"
other_review_backend = "codex"
claude_minimum_remaining = 50

[[profile]]
id = "extract"
escalation_sources = ["plan", "review"]
purpose = "one fixed-input, fixed-output classification, extraction, aggregation, or bounded summary"
# Fixed-shape labor belongs on the cheapest Luna tier. On the Claude window
# the cheap seat is Haiku 5.5 at high, reached only through the claude backend:
# an API-billed route to it pays a five-fold prompt surcharge above 100k tokens
# and draws a paid pool, so none is declared.
provider = "openai-codex"
model = "gpt-6-luna"
effort = "low"
stability = "stable"
backends = ["codex"]

  [[profile.variant]]
  id = "deepseek-go"
  provider = "opencode-go"
  model = "deepseek-flash"
  backend_model = "deepseek-v4.1-flash"
  effort = "max"
  stability = "stable"
  backends = ["pi"]
  default_for_backend = true

  [[profile.variant]]
  id = "haiku"
  provider = "anthropic"
  model = "haiku-5.5"
  backend_model = "claude-haiku-5-5"
  effort = "high"
  stability = "stable"
  backends = ["claude"]
  default_for_backend = true

[[profile]]
id = "explore"
escalation_sources = ["plan", "review"]
purpose = "read-only codebase reconnaissance and source mapping without a verdict"
# Reconnaissance is bounded reading rather than judgment, so it takes the same
# workhorse as implementation, and pi's Go-pool seat reads at low: scouts fan
# out wide, and every fact they report is checked against source before it
# enters a brief, a decision or a report.
provider = "openai-codex"
model = "gpt-6-luna"
effort = "max"
stability = "stable"
backends = ["codex"]

  [[profile.variant]]
  id = "deepseek-go"
  provider = "opencode-go"
  model = "deepseek-flash"
  backend_model = "deepseek-v4.1-flash"
  effort = "low"
  stability = "stable"
  backends = ["pi"]
  default_for_backend = true

  # Reconnaissance on the Claude window defaults to Haiku; Opus at the head
  # model's standing tier, high, is selected with `--variant opus`.
  [[profile.variant]]
  id = "haiku"
  provider = "anthropic"
  model = "haiku-5.5"
  backend_model = "claude-haiku-5-5"
  effort = "high"
  stability = "stable"
  backends = ["claude"]
  default_for_backend = true

  [[profile.variant]]
  id = "opus"
  provider = "anthropic"
  model = "opus-5.5"
  backend_model = "claude-opus-5-5"
  effort = "high"
  stability = "stable"
  backends = ["claude"]

[[profile]]
id = "implement"
escalation_sources = ["execute"]
purpose = "bounded production work whose targets and acceptance probes are already named"
# Luna max is the workhorse seat. GPT-6 Luna holds it at the tier 5.6 Luna
# earned, because its own effort curve is unmeasured.
provider = "openai-codex"
model = "gpt-6-luna"
effort = "max"
stability = "stable"
backends = ["codex"]

  [[profile.variant]]
  id = "terra-medium"
  provider = "openai-codex"
  model = "gpt-6.1-terra"
  effort = "medium"
  stability = "stable"
  backends = ["codex"]

  [[profile.variant]]
  id = "terra-high"
  provider = "openai-codex"
  model = "gpt-6.1-terra"
  effort = "high"
  stability = "stable"
  backends = ["codex"]

  [[profile.variant]]
  id = "terra-xhigh"
  provider = "openai-codex"
  model = "gpt-6.1-terra"
  effort = "xhigh"
  stability = "stable"
  backends = ["codex"]

  [[profile.variant]]
  id = "deepseek-go"
  provider = "opencode-go"
  model = "deepseek-flash"
  backend_model = "deepseek-v4.1-flash"
  effort = "max"
  stability = "stable"
  backends = ["pi"]
  default_for_backend = true

  # First-party Claude implementation defaults to Opus low, below the head
  # model's standing tier of high: the brief names the targets and probes, and
  # the lead inspects the result. Each other stable tier is a named variant a
  # lead picks for the slice: high where it needs the lead's judgment, xhigh
  # for hard reasoning, medium between low and high.
  [[profile.variant]]
  id = "opus-low"
  provider = "anthropic"
  model = "opus-5.5"
  backend_model = "claude-opus-5-5"
  effort = "low"
  stability = "stable"
  backends = ["claude"]
  default_for_backend = true

  [[profile.variant]]
  id = "opus-medium"
  provider = "anthropic"
  model = "opus-5.5"
  backend_model = "claude-opus-5-5"
  effort = "medium"
  stability = "stable"
  backends = ["claude"]

  [[profile.variant]]
  id = "opus-high"
  provider = "anthropic"
  model = "opus-5.5"
  backend_model = "claude-opus-5-5"
  effort = "high"
  stability = "stable"
  backends = ["claude"]

  [[profile.variant]]
  id = "opus-xhigh"
  provider = "anthropic"
  model = "opus-5.5"
  backend_model = "claude-opus-5-5"
  effort = "xhigh"
  stability = "stable"
  backends = ["claude"]

[[profile]]
id = "generate"
purpose = "high-volume or heavily steered candidate generation whose output is raw material rather than a deliverable: drafts to mine, options to sweep, defect candidates to adjudicate. Everything it returns is unverified until a lead or reviewer-tier model checks it against source, and nothing resolved here is the last model to touch shipped work"
provider = "opencode-go"
model = "deepseek-flash"
backend_model = "deepseek-v4.1-flash"
effort = "max"
stability = "stable"
# Steered generation runs on the subsidised Go subscription, the pool pi's
# other defaults already draw, and is closed to every other backend by design.
# Max is the only routed tier: the row carries no lower effort, and no profile
# or variant selects one.
backends = ["pi"]

[[profile]]
id = "interactive"
purpose = "default interactive Pi parent session before a task-specific child route is selected"
# This is a Pi-only shape: the profile names the one backend whose interactive
# session contract it serves.
provider = "opencode-go"
model = "deepseek-flash"
backend_model = "deepseek-v4.1-flash"
effort = "max"
stability = "stable"
backends = ["pi"]

[[profile]]
id = "plan"
escalation_sources = ["review"]
purpose = "read-only technical planning where feasibility, failure modes, and ordered execution are the work"
# Planning is the head model's own seat; a lead on another harness delegates it
# to Sol at xhigh, the strongest Codex tier, by operator direction.
provider = "openai-codex"
model = "gpt-6.1-sol"
effort = "xhigh"
stability = "stable"
backends = ["codex"]

  [[profile.variant]]
  id = "deepseek-go"
  provider = "opencode-go"
  model = "deepseek-flash"
  backend_model = "deepseek-v4.1-flash"
  effort = "max"
  stability = "stable"
  backends = ["pi"]
  default_for_backend = true

  # Astra at xhigh, selected by name.
  [[profile.variant]]
  id = "astra-xhigh"
  provider = "openai-codex"
  model = "gpt-6-astra"
  effort = "xhigh"
  stability = "stable"
  backends = ["codex"]

  # The head model plans at its standing tier, high; this binding is the head
  # default `agent-routing seats` reports. Xhigh is the deep-reasoning variant.
  [[profile.variant]]
  id = "opus"
  provider = "anthropic"
  model = "opus-5.5"
  backend_model = "claude-opus-5-5"
  effort = "high"
  stability = "stable"
  backends = ["claude"]
  default_for_backend = true

  [[profile.variant]]
  id = "opus-xhigh"
  provider = "anthropic"
  model = "opus-5.5"
  backend_model = "claude-opus-5-5"
  effort = "xhigh"
  stability = "stable"
  backends = ["claude"]

[[profile]]
id = "execute"
fallback = [
  { from_provider = "openai-codex", backend = "claude", variant = "opus" },
  { from_provider = "anthropic", backend = "codex" },
]
purpose = "broad or multi-slice implementation where technical judgment and long-horizon persistence remain material"
# Judgment-bearing arcs take the Codex-side technical peer rather than the
# bounded-work Luna seat. On the Claude window the lead picks the tier by the
# work's stakes: low by default, `opus-high` where a wrong result is costly.
provider = "openai-codex"
model = "gpt-6.1-sol"
effort = "xhigh"
stability = "stable"
backends = ["codex"]

  [[profile.variant]]
  id = "deepseek-go"
  provider = "opencode-go"
  model = "deepseek-flash"
  backend_model = "deepseek-v4.1-flash"
  effort = "max"
  stability = "stable"
  backends = ["pi"]
  default_for_backend = true

  [[profile.variant]]
  id = "opus"
  provider = "anthropic"
  model = "opus-5.5"
  backend_model = "claude-opus-5-5"
  effort = "low"
  stability = "stable"
  backends = ["claude"]
  default_for_backend = true

  [[profile.variant]]
  id = "opus-high"
  provider = "anthropic"
  model = "opus-5.5"
  backend_model = "claude-opus-5-5"
  effort = "high"
  stability = "stable"
  backends = ["claude"]

[[profile]]
id = "review"
escalation_sources = ["plan"]
purpose = "read-only correctness and regression review of a bounded behavior-affecting change"
# Author-aware independent review excludes every author of the reviewer's
# family, by the `[[family]]` relation in models.toml, and compares the
# author's review_tier or unseated author_floor with the route's review_tier.
# Authorless resolution exposes these constraints without claiming
# independence.
provider = "openai-codex"
model = "gpt-6.1-sol"
effort = "xhigh"
stability = "stable"
backends = ["codex"]

  [[profile.variant]]
  id = "deepseek-go"
  provider = "opencode-go"
  model = "deepseek-flash"
  backend_model = "deepseek-v4.1-flash"
  effort = "max"
  stability = "stable"
  backends = ["pi"]
  default_for_backend = true

  # GPT-authored diffs need a reviewer outside the Codex pool. Keep the roster
  # id separate from the first-party Claude client id so the route records both
  # the policy model and the callable backend model. First-party review runs
  # at xhigh, the deep-review tier, above the head model's standing high.
  [[profile.variant]]
  id = "opus"
  provider = "anthropic"
  model = "opus-5.5"
  backend_model = "claude-opus-5-5"
  effort = "xhigh"
  stability = "stable"
  backends = ["claude"]
  default_for_backend = true

  [[profile.variant]]
  id = "astra"
  provider = "openai-codex"
  model = "gpt-6-astra"
  effort = "medium"
  stability = "stable"
  backends = ["codex"]

  [[profile.variant]]
  id = "high-stakes"
  provider = "openai-codex"
  model = "gpt-6-astra"
  effort = "xhigh"
  stability = "stable"
  backends = ["codex"]

  # Security-sensitive review on the Daybreak configuration of GPT-5.6 Sol, whose
  # safeguards are tuned for authorized defensive work. Selected only by name;
  # the profile's default never resolves to it.
  [[profile.variant]]
  id = "cyber"
  provider = "openai-codex"
  model = "gpt-daybreak-blue"
  backend_model = "gpt-daybreak-blue-latest"
  effort = "xhigh"
  stability = "stable"
  backends = ["codex"]

[[profile]]
id = "design"
purpose = "read-only judgment on UX, copy, API ergonomics, or architectural simplicity"
# Taste is the head model's axis, so design judgment takes its standing tier,
# high; `--variant xhigh` is the deep design review.
provider = "anthropic"
model = "opus-5.5"
backend_model = "claude-opus-5-5"
effort = "high"
stability = "stable"
backends = ["claude"]

  [[profile.variant]]
  id = "xhigh"
  provider = "anthropic"
  model = "opus-5.5"
  backend_model = "claude-opus-5-5"
  effort = "xhigh"
  stability = "stable"
  backends = ["claude"]

[[profile]]
id = "visual"
purpose = "visual and identity design: the look of an interface, mockups, palettes, marks and icons, delivered as preview artifacts or a design spec"
# Fable 5.2 holds the visual seat by operator direction of 2026-11-09. High is
# the standing tier and the reasonable ceiling; medium is the cheaper named
# variant. Low, xhigh and max stay explicit selections on the row.
provider = "anthropic"
model = "fable-5.2"
backend_model = "claude-fable-5-2"
effort = "high"
stability = "stable"
backends = ["claude"]

  [[profile.variant]]
  id = "medium"
  provider = "anthropic"
  model = "fable-5.2"
  backend_model = "claude-fable-5-2"
  effort = "medium"
  stability = "stable"
  backends = ["claude"]

[[profile]]
id = "computer-use"
purpose = "explicit visible-desktop tasks with bounded context and retained follow-ups"
provider = "openai-codex"
model = "gpt-6.1-sol"
effort = "low"
stability = "experimental"
backends = ["codex", "pi"]

  [[profile.variant]]
  id = "medium"
  provider = "openai-codex"
  model = "gpt-6.1-sol"
  effort = "medium"
  stability = "experimental"
  backends = ["codex", "pi"]

  [[profile.variant]]
  id = "high"
  provider = "openai-codex"
  model = "gpt-6.1-sol"
  effort = "high"
  stability = "experimental"
  backends = ["codex", "pi"]

  [[profile.variant]]
  id = "xhigh"
  provider = "openai-codex"
  model = "gpt-6.1-sol"
  effort = "xhigh"
  stability = "experimental"
  backends = ["codex"]

  [[profile.variant]]
  id = "opus"
