[[repository]]
id = "harness"
name = "fixture-harness"

[[accessor]]
id = "instructions"
command = ["agent-harness", "delegation-sources"]
expected_sources = ["settings"]

[[consumer]]
id = "harness-agents"
repository = "harness"
path = "agents"
checks = ["roster-literals", "agent-frontmatter"]
generated = "claude-agents"

[[proxy]]
consumer = "harness-agents"
path = "proxy.md"
model = "swift"
effort = "low"

[[pin]]
consumer = "harness-agents"
path = "implement-atlas.md"
model = "atlas"
effort = "medium"
profile = "implement"
variant = "atlas"
backend = "claude"
generated = true
