# Routing's integration gates. The consumer lint reads the sibling repositories
# under AGENT_CODE_ROOT, so it catches a roster pin that lands in a consumer
# as well as one that lands here.
[gates.test]
command = "python3 -m pytest -q"

[gates.lint]
command = "bin/lint-routing"

[gates.consumers]
command = "AGENT_CODE_ROOT=${AGENT_CODE_ROOT:-$HOME/code} bin/lint-consumers"
