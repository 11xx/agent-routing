# The change gate: it compiles the candidate, runs the fixed invariants in
# checks/invariants.toml (read from the change's base), the whole test suite
# and the witnesses the change's commits name, within the 5-second budget
# bin/check-change declares. The consumer lint reads sibling repositories and
# runs on demand as `agent-routing lint-consumers`.
[gates.check-change]
command = "bin/check-change"
