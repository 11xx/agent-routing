[[model]]
id = "deepseek-flash"
family = "deepseek"
status = "experimental"
role = "high-volume steered generator, and measured once as more than that on the build in service. Its output is raw material a lead or reviewer-tier model extracts from — candidates to rule out, drafts to mine, breadth to sweep — and nothing it produces ships unchecked. Speed and a million-token context make it good at producing a lot, at a list price under the implementer tiers and over the build it replaces. The restriction is probation, not a verdict on this build: the fabrication record belongs to the predecessor, and one field arc on 2026-09-18 is the only evidence of its own the row carries"
character = "the live build is V4.1 Flash, and every figure and field observation on this row belongs to the V4 Flash 0731 build it replaces. DeepSeek reports 54.4 on DeepSWE at max effort for that predecessor using its own unreleased Harness minimal mode — vendor evidence, not a pass@1 row comparable to this matrix. The family's direction across builds is upward, and each release has been reported stronger than the one before it; none of that is measured here. `status = \"experimental\"` is exactly what the seat is — probation, routed for generation and unpromoted until a field arc records the build actually doing the work, rather than a settled judgment carried forward from a retired one"
weaknesses = ["PREDECESSOR EVIDENCE, V4 Flash 0731, field-reported 2026-08-01 (independent single-reviewer testing, not a neutral benchmark): fabricated confidently and reproducibly. On an agentic Splunk CTF question it invented an answer on EVERY run across max and high reasoning and temperatures from 1.0 down to 0.6 — once echoing the example key out of the prompt, once inventing a secret absent from the searched data. Qwen3 27B, Tencent Hi3, MiniMax, and Inkling did not fail this way", "PREDECESSOR EVIDENCE: Artificial Analysis reported an 84% hallucination rate for the 0731 build (the V4 Pro preview: 94%)", "PREDECESSOR EVIDENCE: it ignored explicit plan instructions — given a plan whose first line pinned a specific dependency version, it pinned a different one. That is why a pre-resolved brief bought no safety on that build: the brief is what it disregarded", "PREDECESSOR EVIDENCE: verbose to the point of noise — materially more lines of code and more tests than better-scoring models on the same task, while scoring worse. Volume is not effort", "PREDECESSOR EVIDENCE: on a long-horizon plan-execution task (many tool calls over 20-60 minutes) it scored below Tencent Hi3 at both efforts — Hi3's LOW effort beat that build's HIGH, and Hi3 beat its max. Reproduced across two harnesses, so not a harness artifact", "THE LIVE BUILD HAS TWO FIELD ARCS, and this is the entry that governs the five above. Every one of them was observed on V4 Flash 0731, which V4.1 Flash replaces, and the 53% / $0.46 board row is the predecessor's. They are not findings about the build in service. On 2026-09-18 V4.1 implemented three stacked slices in an unfamiliar 50k-line Rust CLI under an Opus lead: 7 commits, ~2,100 lines, gates green at every patchset, two blocking findings in one of three slices, both repaired on the first return with probes that failed beforehand for the predicted reason. It bettered the brief's mechanism, argued a design call it was invited to argue and won it, and disclosed an attribution error against itself that nothing obliged it to report. No fabricated identifier, API, or test result appeared in anything the lead probed. On 2026-09-19 it then ran an eighteen-slice batch unattended for 2h11m: 17 slices landed with gates green at every patchset, one stopped correctly on a verified premise failure rather than fabricating progress, zero executor-caused defects survived review, and its one slip — snapshotting on the wrong branch — it repaired and reported unasked. The predecessor's two measured failures, fabrication and long-horizon plan loss, appeared in neither arc. Neither tests approval, brief-less work, or a surface where a wrong answer passes every gate, so the seat stays probationary. See eras/2026-09-18-deepseek-flash-v41-fork-fix-field-arc.md and eras/2026-09-19-deepseek-flash-v41-long-horizon-batch.md"]
api_price_per_million = { cache_hit_input = 0.006, cache_miss_input = 0.30, output = 1.2 }
notes = "Reached through pi as `--provider deepseek --model deepseek-flash`: the unversioned id is the one the provider carries across point releases, and the versioned id it replaces is deprecated. Live-probed through the `generate` delegation path on 2026-09-18, which the API answered as `deepseek-flash`. The V4.1 list price is roughly twice the 0731 cache-miss input and four times its output, so the generator costs materially more per task than the $0.46 the board measured on the predecessor. Reachable on more than one pool, and the pools differ in retention posture rather than in capability: zero-retention routes exist at some providers, while the opencode-go route is gated behind an explicit China-hosting opt-in and stays unrouted until the operator takes it. The weights are open, so a fourth posture exists that the hosted pools cannot offer: run it locally and no third party sees the prompt at all. That changes who holds the data, never whether the output can be believed — a locally hosted fabricator fabricates identically."
open_weights = true
niches = ["the open-weight route carries no frontier refusal surface, which makes it the practical choice for authorized security work — probing one's own systems for vulnerabilities — where hosted frontier models lecture, refuse, or degrade mid-task. Authorization is the operator's to establish; the model will not ask", "generation quality responds to exemplars rather than to constraints. Out of the box its code is functional and graceless, and the fix is showing it what the target should look like. Briefs that fence what it may not do get verbose noise; briefs carrying concrete style references get usable raw material", "field reports credit it with real medium-horizon agency — orchestrating subagents, checking its own work, catching and correcting its own wrong turns. That is compatible with everything measured here and changes nothing: the ceiling on its use is trust, not capability, and horizon buys no trust"]
  [[model.effort]]
