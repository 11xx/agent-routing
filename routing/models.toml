  use = "probationary trial tier, operator-directed only: `agent-routing validate --profile <shape> --backend pi --model mimo-v2.6-pro --effort high --provider opencode-go --reason <text> --allow-experimental`. The same ceiling as Flash — a fully specified brief, named probes, scope ceiling, lead review — and selected when a trial wants the sibling. Wall-clock belongs in the price: the tail is the pair's, so run it where the queue behind the slot is empty"

# Narrative that the per-model fields cannot carry: the framing sentence and
# the vocabulary the matrix is read with. Kept here so the whole prose view has
# one source, rather than a generated table beside a hand-written preamble.
[prose]
intro = "Standing defaults for complementary Claude and Codex orchestration. **Opus 5.5 is the head model** — it plans, orchestrates, delegates, and owns the final answer — and Sol is the technical peer and execution axis beneath it. Delegation uses the other subscription where its model or quota is a better fit. Only models verified through current local backends are routed; probationary API models are labeled experimental. Availability history remains in `~/code/agent-routing/eras/`."
glossary_intelligence = "how complex a problem the model completes correctly, unsupervised."
glossary_taste = "cleanliness of UI/UX, architectural code quality, API design, copy."
closing = "These are **defaults, not limits**, except where a model or effort is explicitly prohibited. Judge output rather than rank alone: Luna max carries bounded implementation, Astra medium planning, Sol review, technical judgment, and persistence, and Opus planning, orchestration, taste, and synthesis. Machine-readable form: `agent-routing models` / `agent-routing delegation`; mechanism prose: `agent-routing mechanism`. Never route work through harness-native subagent defaults; invoke executors explicitly with stated model, effort, and a curated brief."

# Subscription quota: observed for Claude and published as credits for Codex.
# Re-measure observed figures when a plan or model changes. Do not extrapolate
# one provider's accounting onto another.
[quota]
method = "Claude uses observed share of one rolling window consumed by a session of known token count. OpenAI publishes Codex credits per million input, cached-input, and output tokens plus approximate messages per five-hour window."
weighting = "MODEL-WEIGHTED on both subscriptions. Claude evidence is observed: the same ~500k uncached tokens consumed ~15% of a window on opus-5 and ~30% on fable-5. Codex evidence is explicit and exactly cost-weighted: every token class of the 5.6 and GPT-6 families with a published API price costs 25 credits per API dollar, so task-level credit ratios equal the benchmark cash ratios."
claude_plan = "Max, 5h rolling window plus a weekly cap. The ratios below were observed on Pro $20 and transfer as ratios, not as window sizes"
claude_opus_5 = "~500k uncached tokens ~= 15% of one window, so roughly 3.3M uncached tokens per window"
claude_opus_5_5 = "unmeasured; the vendor reports raised five-hour limits and a lower per-token price than Opus 5, so the Opus 5 ratio is the working upper bound until a session measures it"
claude_fable_5 = "~500k uncached tokens ~= 30% of one window when it was still on the subscription: opus-5 does the same work for about half the quota"
claude_fable_5_1 = "metered like Fable 5 and capped at half of a Max plan's weekly allowance; its ratio against opus-5.5 on this plan is unmeasured, and the Fable 5 figure is the working assumption until it is"
caching = "these are UNCACHED figures; a cache-warm session stretches the window substantially, which is why long single-context arcs beat repeated cold re-derivation"
codex_pool = "ChatGPT Work and Codex share one five-hour window across the codex CLI and pi's openai-codex login. Official Plus estimates are 5.6 Sol 10-100, Terra 25-200, and 5.6 Luna 250-2,000 local messages per five hours for the 5.6 family, and GPT-6 Astra 5-45, GPT-6.1 Sol 15-160, GPT-6 Sol 15-150, and GPT-6 Luna 350-3,000; these approximate ranges are not exact transforms of the credit schedule because use varies with context, reasoning, tools, retrieval, and caching. On the 2026-09-29 read the page lists the same ranges for Standard Business, states that Pro plans currently have no five-hour limit, and warns that weekly limits may also apply."
opencode_go_pool = "CONDITIONAL, not standing: an optional $10/month subscription reached through the opencode CLI, drawing on neither of the two pools above. Limits are denominated in usage dollars rather than credits or observed share — $12 per five hours, $30 weekly, $60 monthly — so the benchmark cash column converts directly into per-window capacity instead of needing a separate transform. Alone among the three pools it is locally measurable: `opencode stats` reports cumulative spend and `--format json` reports per-step token counts. Nothing degrades to it automatically; a lapsed subscription is a stop, not a fallback. FIELD-MEASURED, 2026-10-02: gpt-6-luna max on this pool through pi hit the upstream token rate limit at six, two, and one parallel lanes even though the subscription's dollar windows were not exhausted; bare model 400 errors preceded the rate-limit responses. The Codex pool is Luna's working route."

[policy]
latency = "wall-clock is a routing axis beside cash and output tokens: a cheap tier that answers slowly still holds the harness slot, and in a queue of several harnesses the tail is what frees it for the next task. Measured 2026-09-22 on mimo-v2.6-flash through pi on the Go pool — a median 19.8s per assistant turn across 71 turns with a 61s ninetieth percentile, 75% of output tokens spent reasoning, and one formatting task run to 763.6s after 40,310 reasoning tokens where deepseek-flash took 33.6s on the identical prompt. The tail is the family's rather than one row's — both MiMo V2.6 rows blew up on repeat runs of one prompt, Pro's worst run outlasted Flash's — and it follows the effort lever as much as the model: luna low ran the same prompt in 17.9s where luna max did not complete the prompt inside 240s and 300s caps. Choose rows for the queue they run in: work nobody waits on can take the slow row, work that gates other harnesses cannot, and where a row's tail is this wide the tail is what to budget by"
effort_cliff = "the 5.6 family degrades steeply on agentic work at low effort. Luna's curve is the steepest on the board (2% low to 67% max): low/medium remain bounded function-shaped calls, while high and above remain non-stable planned-execution tiers until controlled field evidence lands. Never generalize one Luna tier's behavior from another"
horizon = "task distance is a routing axis the pass@1 column does not carry. A model's error is set at the start, when it interprets what the target actually is, and the longer the arc the further a small misreading compounds — the same misinterpretation that is harmless over a five-line change lands somewhere unrecognisable at the end of an unattended hour. Two consequences. Cheap tiers are safe over short distances almost regardless of how well they interpret, which is why bounded slices route down and broad ambiguous arcs do not. And the cost of an underspecified target is paid in proportion to arc length, so specification effort belongs where the arc is long, not where the task is hard. This is what the delegation ladder already prices as residual risk after the gate; naming the axis keeps the reason legible when a cheap tier looks tempting for a long run"
non_scaling_tops = "a top tier is not selected from benchmark rank alone. Opus 5 measured a non-scaling top — xhigh bought 0 points over high for +49% and max 1 for +95%. Opus 5.5 xhigh and GPT-6.1 Sol xhigh are the operator's stable working tiers, without a Datacurve effort calibration for either; their max tiers remain explicit-only and never automatic escalations. Astra xhigh remains the high-stakes planning variant"
prohibited = "never select, including on explicit request: opus-5 xhigh, opus-5 max, 5.6 Sol ultra, 5.6 Sol max, GPT-6 Sol max, Astra high, Astra max. Opus-5.5 xhigh and GPT-6.1 Sol xhigh are stable defaults for their existing seats; their max tiers are explicit-only"
delegation_effort = "priced by residual risk after the gate, not by handoff ambiguity: Luna max is the stable default for source-verified bounded work, from fully pre-resolved slices through ordinary implementation judgment. Luna high remains benchmarked but is not routed because max gains 23 pass@1 points while remaining cheaper than Terra high. GPT-6.1 Sol xhigh holds the judgment-bearing execute and review seats; Astra xhigh is the high-stakes planning and review variant, and GPT-6.1 Sol max is explicit-only. Migrations, schema/breaking changes, destructive operations, and security keep the Sol-xhigh floor regardless of specification quality"
acceptance_probes = "the mechanism that makes the executor floor safe: every implementation brief routed below the Sol-xhigh floor names acceptance probes as runnable commands, and the executor records each at the final head with `arc verify --command` so the evidence lands in the ledger. Loudness is constructed by the lead, not bought with a higher tier — naming a probe requires knowing the required behavior, not predicting the executor's mistake. Caveat to state rather than gloss: readiness consults declared gates only, so ad hoc probe evidence never gates and never turns green; the convention is reviewer-enforced, and a reviewer who assumes the tool is checking will stop checking"
floor_failure_response = "pre-registered so the reflex does not decide it: if a workhorse-authored semantic defect passes its named probe and first review, or two of the fixed next-six workhorse cohort need extra verdict rounds for executor-caused defects, the remedy is to make acceptance probes declarable so they gate — not to buy a higher tier. An absent or non-discriminating probe is a machinery gap; escalation is the fallback only if declarable probes exist and the defect recurs anyway. Changing the workhorse model does not silently reset the cohort"
floor_measurement = "the trigger above is only evaluable if the data is recorded: each delegated change records the exact model and effort that implemented it, and every review round is classified brief-caused, executor-caused, or integration-staleness. Only executor-caused rounds count against the floor. This is observational, not a controlled experiment — cause is not a structured verdict field and there is no counterfactual executor"
head_model = "opus-5.5 xhigh leads: it plans, orchestrates, delegates, and synthesizes at the routing ceiling. Max remains explicit-only, not an escalation tier. A slice the working tier cannot land gets decomposed, given better context, or a sideways second opinion rather than an automatic effort increase"
quota_window = "the Claude window remains the scarcer pool, so keep the head model on judgment and push specified labor to Codex. OpenAI's published schedule prices the 5.6 and GPT-6 families at 25 credits per API dollar, so benchmark cash ratios transfer directly into task-level credits. Official Plus estimates are 5.6 Sol 10-100, Terra 25-200, and 5.6 Luna 250-2,000 local messages per five hours, and GPT-6 Astra 5-45, GPT-6.1 Sol 15-160, GPT-6 Sol 15-150, and GPT-6 Luna 350-3,000. Route bounded labor to Luna max, and spend Sol only where technical judgment or token-efficient persistence earns its rate. Codex fast mode consumes 2.5x credits; Claude fast mode burns its window substantially faster. Both stay deliberate, never ambient"
user_facing = "opus-5.5 writes or reviews novel user-facing work: UX, copy, API shape, and final polish. Sol may implement against an already-settled design system, but novel design and final polish stay on the Claude taste axis"
review_generation = "defect generation and defect adjudication are separable and priced differently. Generation can run on a model below the reviewer floor if it is given an adversarial brief — one that names the failure mode gates cannot catch, enumerates the defect classes to sweep, and refuses a bare 'no issues' by requiring each ruled-out class to name the file and reasoning. Adjudication cannot: every finding from a sub-floor generator is a candidate until a reviewer-tier model or the lead confirms it against source. Measured 2026-07-27: the V4 Pro preview at 8% pass@1 produced six confirmed defects and two fully fabricated blocking claims in the same run. V4 Flash 0731's vendor-reported improvement does not add a reviewer tier or change who may issue a verdict; independent 2026-08-01 testing puts its hallucination rate at 84% and shows it fabricating on every run of an agentic task, which is why it generates candidates and never adjudicates them. Generation is also where its speed, million-token context, and price actually pay: breadth is cheap and a lead is doing the ruling-out anyway"
escalation = "an escalation above the caller's own seat, or into a scarcer pool, is offered to the user by default, naming the route, what it buys, and the pool it spends; a standing user instruction pre-authorizing escalation replaces the ask for the work it covers. Routing upward within what the caller's seat costs, or to the caller's own tier (preferring an equivalent tier from another lab), is ordinary. A declined offer leaves work without a floor at the caller's tier; work under a floor waits. Candidates compare as model-and-effort tiers, capability and cost together, and taste breaks ties"
taste = "taste is the larger models' edge on work no benchmark scores and varies by domain: on the operator's read Fable 5.1 leads engineering design and front-end visual work with Opus 5.5 just behind on front end, and Opus 5.5 leads prose and copy, well above Astra. Taste breaks ties between close tiers and decides before cost for design, visual, and copy work; operator judgment, not a measurement"
founding_slices = "a clean repository's founding slices set the conventions later models imitate, so they route to the head model at its routing ceiling and the conventions land in AGENTS.md and the fmt and lint gates; operator direction, not a measurement"
review = "the verdict never claims independence from the model that authored the diff; a lead reviewing delegated work it did not author is valid coverage. Independent review is an escalation for policy, explicit user requirements, or high-consequence approvals, and routine deferred coverage is recorded as Arc debt. Concrete reviewer routes come from profiles and current roster data rather than this frozen sentence. Debt never overrides changes-requested"
