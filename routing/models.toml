[[model]]
id = "mimo-v2.6-flash"
family = "xiaomi"
aliases = ["mimo-2.6-flash"]
status = "experimental"
role = "probationary trial route on the Go pool. The operator's preference between the MiMo pair is open: Flash was the designated benchmark subject at entry, and after the 2026-09-22 latency measurement the operator expects to try the sibling more — where the measurements show no speed advantage either way, so capability is the tie-breaker and it is unmeasured on both. It holds deepseek-flash's probation footing — a named brief, raw material until someone checks it, never the last model to touch shipped work — with none of that row's evidence behind it: no measured score, no field arc, no approval anyone has confirmed. Selection is operator-directed through pi with --allow-experimental; no profile resolves to it, nothing degrades to it, and a verdict it offers stays a candidate until a lead or a second reviewer confirms it against source"
character = "Xiaomi's MiMo V2.6 Flash, the cheap half of the pair: 0.14 input and 0.28 output per million, a 1.0M-token context and 131k of maximum output, served through pi on the opencode-go pool. It reasons — a live probe returned reasoning tokens beside its answer — and a trial call costs a fraction of a cent, which makes benchmarking it cheap in cash and no cheaper in oversight: nothing on this row says what it does on a real slice"
weaknesses = ["unmeasured in every column that matters: no pass@1 row on this matrix, no field arc, no review round, no approval anyone has confirmed. The seat is probation on availability and price, not on a score", "the effort lever does not demonstrably reach it: pi's catalog maps no thinking levels for this model, so xhigh and max are dropped and a requested max is clamped to high without reporting it, and a 2026-09-22 probe saw the same reasoning-token count at off and at high on a trivial prompt. The declared tier names the level pi sends, not a calibrated lever", "the pool it draws on is an optional dollar-metered subscription: a lapsed or missing credential is a stop, never a fallback, and this pool holds no roster seat for anything to degrade into", "nothing on the row separates it from mimo-v2.6-pro — the same absence of evidence at a sibling's price. Until a trial measures the pair they cannot be ranked here, only preferred, and the preference is recorded as the operator's", "FIELD-MEASURED, 2026-09-22: wall-clock slow, and wall-clock is a routing axis the moment harnesses queue behind one slot. Over one interactive session of 71 assistant turns on this row the median turn took 19.8s, the mean 29.3s, the ninetieth percentile 61s and the worst 147.9s, with 75% of the session's output tokens spent on reasoning (75,944 of 101,804) and the worst turns being the reasoning-heavy ones. Three runs of one identical 60-item formatting prompt put this row's tail at 763.6s (40,310 reasoning tokens), 153.4s (7,269) and 17.5s (67) — two of three in a reasoning loop — where deepseek-flash ran the same prompt in 33.6s and 57.3s with no blowup at four to five times the decode rate (~213-264 tok/s against this row's ~50-66) and luna low ran it in 17.9s. The blowup is reasoning volume at slow decode rather than provider queueing — the token rate holds while the model thinks for twelve minutes about a formatting task — and it is intermittent. The tail is the pair's rather than this row's alone: mimo-v2.6-pro's worst run outlasted it (killed at a twenty-minute cap mid-reasoning), so the sibling's ~3x price buys no measured speed. It also follows the effort lever as much as the model: luna low finished the same prompt in 17.9s where luna max did not complete the prompt inside 240s and 300s caps. Consequence for routing: price a queue position beside the cash. Trials on this row belong where nobody's next task waits on the answer, because the tail rather than the median is what frees the harness"]
api_price_per_million = { input = 0.14, cached_input = 0.0028, output = 0.28 }
notes = "Live-probed through pi 0.87.0 on 2026-09-22 via `--provider opencode-go --model mimo-v2.6-flash --thinking max`: it answered and billed at list (1,430 input tokens for $0.0002). The operator's shorthand `mimo-2.6-flash` is this row's alias. Also listed on openrouter as `xiaomi/mimo-v2.6-flash` at the same price, and on the GOAT catalog as `xiaomi/mimo-v2.6-flash` at zero marginal cost — GOAT's closed set names Luna and GLM 5.3 Flash, so that pool is not a route until the operator widens it. A free `mimo-v2.6-flash-free` tier exists on the opencode provider at a 200k context and 32k output; that is smaller capacity, not a cheaper price on this row. See eras/2026-09-22-mimo-v26-enters-probation.md"
