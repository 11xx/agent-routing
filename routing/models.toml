# Model/effort routing matrix: the machine-readable view of the roster.
# The authored view is doctrine/model-routing.md, which is what lands in every
# harness's instruction files. Neither is generated from the other — each keeps
# something the other cannot express — so `agent-routing lint` reports where
# they disagree rather than asking anyone to remember to sync them.
# Access without a path: `agent-routing models`.

[meta]
benchmark = "DeepSWE v1.1, 113 tasks, 2026-07-27"
metric = "pass@1 / avg $ / output tokens"
updated = "2026-07-27"
era_notes = "Opus 5 replaced Opus 4.8 on 2026-07-25 and took the head-model seat Fable 5 held; Fable 5 is fully retired (credits-only direct billing, no subscription route). History in eras/"

[[model]]
id = "opus-5"
family = "claude"
role = "primary lead and default head model: planning, orchestration, taste, inferred intent, novel UX/copy, API and architectural ergonomics, simplification, and user-facing review; synthesizes delegated work and owns the final answer"
character = "tops the roster: high beats every Sol tier including sol max, and beats Fable at every comparable effort for a fraction of the cost. Field evidence adds one thing the benchmark does not measure — it is a smaller model than Fable and lacks Fable's ceiling on genuinely novel hard reasoning. Both readings are true; deepswe measures bounded SWE tasks, not that ceiling. It gains more from cheap workhorses than Fable did, so decompose-and-delegate is how it earns its cost."
weaknesses = ["stops scaling above high, harder than any other family: xhigh buys 0 points for +49% cost and max buys 1 point for +95%. Both are prohibited; high is the hard ceiling", "as head model it authors most planning and taste work, so the reviewer line matters more, not less: never let it review its own diff", "token-hungry relative to Sol at the same pass@1 (high: 64k out vs sol high 28k) — on the metered-free Claude subscription that is quota, so route specified labor to the codex pool"]
  [[model.effort]]
  effort = "max"
  pass_at_1 = 0.74
  usd_per_task = 11.84
  out_tokens = "118k"
  use = "prohibited: never select, including by explicit request. +1 point over high for +95% cost and 1.8x the output tokens, against a tier that already tops the roster"
  [[model.effort]]
  effort = "xhigh"
  pass_at_1 = 0.73
  usd_per_task = 9.07
  out_tokens = "92k"
  use = "prohibited: never select, including by explicit request. Identical pass@1 to high for +49% cost and 1.4x the tokens — it buys nothing measurable"
  [[model.effort]]
  effort = "high"
  pass_at_1 = 0.73
  usd_per_task = 6.08
  out_tokens = "64k"
  use = "default lead tier and the roster ceiling: plan, orchestrate, delegate, synthesize, review. Nothing available scores higher, so a hard slice gets decomposed or given more context, never escalated upward"
  [[model.effort]]
  effort = "medium"
  pass_at_1 = 0.69
  usd_per_task = 3.29
  out_tokens = "37k"
  use = "quota-conscious lead tier: matches sol high's pass@1 at half the output tokens of opus-5 high. Use for routine leading and long sessions where the Claude window is the binding constraint"
