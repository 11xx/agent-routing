# routable; they activate only when the OpenCode backend is probed and
# real benchmark rows replace the band estimates.
[[model]]
id = "grok-4.5"
family = "xai"
status = "inactive"
role = "benchmarked but unreachable: no probed backend. high scores 54% at $2.42 / 36k out — the opus-4.8-high band the earlier estimate predicted, and dominated by sol medium (61% at $1.86). Activating it would add a cheap second-opinion voice, not a new capability tier"

[[model]]
id = "kimi-k3"
family = "moonshot"
status = "inactive"
role = "benchmarked but unreachable: no probed backend. max scores 69% at $4.65 / 81k out — sol-high band for more cash and 2.9x the tokens, better than the earlier variable-Fable-band guess. The strongest inactive row, and the one worth probing the OpenCode backend for"

[[model]]
id = "small-model-class"
family = "small"
status = "restricted"
role = "never for anything that ships. The class is no longer uniformly weak — gemini-3.6-flash high reaches 49% — but every row is dominated by a cheaper or better 5.6 tier, and the fast-and-cheap ones (kimi-k2.7-code 31%, glm-5.2 high 36%, gemini-3.1-pro 12%) are far below the floor for delegated work"

[[model]]
id = "deepseek-v4-pro"
family = "deepseek"
status = "restricted"
role = "candidate generator under a brief, never an adjudicator. Reachable through the pi backend on a deepseek login whose quota is independent of the codex pool, which is the only reason to reach for it: it is the reviewer of last resort when codex is exhausted and opus-5 would otherwise be reviewing its own diff"
character = "far below the floor on autonomous work — 8% pass@1 places it under luna low/medium, not near sonnet — yet under an adversarial review brief it produced six real defects across eight changes that a neutral 'review this' ask from the same model missed entirely. The value came from the brief and from a lead who checked every claim, not from the model. Field-measured 2026-07-27"
weaknesses = ["writes confident, well-argued, entirely false findings: two of eight blocking claims in the measured run described an artifact of a malformed diff rather than the branch, with full failure scenarios attached", "cannot be trusted to notice that its input is wrong, which is the failure a peer-grade reviewer catches first", "recording its verdict through `--on-behalf-of` over-credits, because arc's `--model` field records the invoker's model and there is no field for the subject's"]
notes = "cost per task on this benchmark is unmeasured here; published output pricing is cheap but that was not the deciding factor"
  [[model.effort]]
  effort = "max"
  pass_at_1 = 0.08
  use = "only as a briefed defect generator whose every finding a lead verifies against source before acting. Never the independent reviewer of record, never an implementer, never a planner"

# Narrative that the per-model fields cannot carry: the framing sentence and
# the vocabulary the matrix is read with. Kept here so the whole prose view has
# one source, rather than a generated table beside a hand-written preamble.
[prose]
intro = "Standing defaults for complementary Claude and Codex orchestration. **Opus 5 is the head model** — it plans, orchestrates, delegates, and owns the final answer — and Sol is the technical peer and execution axis beneath it. Delegation uses the other subscription where its model or quota is a better fit. Only models normally available on the active subscriptions are routed. Availability history remains in `~/code/ai-agent-routing/eras/`."
glossary_intelligence = "how complex a problem the model completes correctly, unsupervised."
glossary_taste = "cleanliness of UI/UX, architectural code quality, API design, copy."
closing = "These are **defaults, not limits**, except where a model or effort is explicitly prohibited. Judge output rather than rank alone. Machine-readable form of this matrix and the delegation mechanism rules: run `agent-routing models` / `agent-routing delegation` (no path needed). Mechanism-routing prose canon: `agent-routing mechanism`. Never route work through harness-native subagent defaults; invoke executors explicitly with stated model, effort, and a curated brief."

# Subscription quota, measured rather than inferred from API cash price.
# Neither vendor exposes a consumption meter, so these observed ratios are
# the only budgeting instrument available. Re-measure when a plan or model
# changes; do not extrapolate one provider's figures onto the other.
[quota]
method = "observed share of one rolling window consumed by a session of known token count"
claude_plan = "Pro $20, 5h rolling window"
claude_opus_5 = "~500k uncached tokens ~= 15% of one window, so roughly 3.3M uncached tokens per window"
claude_fable_5 = "~500k uncached tokens ~= 30% of one window when it was still on the subscription: opus-5 does the same work for about half the quota"
caching = "these are UNCACHED figures; a cache-warm session stretches the window substantially, which is why long single-context arcs beat repeated cold re-derivation"
codex_pool = "chatgpt-codex subscription, shared by sol, terra, luna, and both the codex and pi backends; weighting per model is unmeasured, so never assume terra or luna conserves quota"

[policy]
effort_cliff = "the 5.6 family degrades steeply on agentic work at low effort; sol low is the field-tested exception for tightly scoped pre-resolved execution under an orchestrator, and luna low/medium remains the exception for bounded function-shaped calls. Luna's curve is the steepest on the board (2% low to 67% max), so never generalize a luna tier's behavior from another"
non_scaling_tops = "every family stops paying before its top tier, so 'tops the bench' is never a reason to select one. opus-5 above high: +0 points at xhigh for +49%, +1 at max for +95%. sol above xhigh: +2 points at max for +78%. fable above high: <=1 point for 1.5-2.4x. Hard ceilings are opus-5 high and sol xhigh; everything above them is prohibited"
prohibited = "never select, including on explicit request: opus-5 xhigh, opus-5 max, sol ultra, sol max. Hard ceilings are opus-5 high and sol xhigh"
delegation_effort = "priced by residual risk after the gate, not by handoff ambiguity: sol low is the default when the brief is source-verified and bounded AND the lead can name a final-head command whose outcome discriminates each material risk. Escalate to medium or high when the brief still leaves an architecture, API, or semantic choice to the executor, or when no such discriminating command exists. xhigh is the hard Sol ceiling; Sol ultra and max are prohibited; terra is explicit fallback only. Migrations, schema/breaking changes, destructive operations, and security keep the high-stakes floor regardless of how well specified they are"
acceptance_probes = "the mechanism that makes the floor safe: every brief delegated to a low tier names acceptance probes as runnable commands, and the executor records each at the final head with `arc verify --command` so the evidence lands in the ledger. Loudness is constructed by the lead, not bought with a higher tier — naming a probe requires knowing the required behavior, not predicting the executor's mistake. Caveat to state rather than gloss: readiness consults declared gates only, so ad hoc probe evidence never gates and never turns green; the convention is reviewer-enforced, and a reviewer who assumes the tool is checking will stop checking"
floor_failure_response = "pre-registered so the reflex does not decide it: if a low-authored semantic defect passes its named probe and first review, or two of THE NEXT SIX low changes need extra verdict rounds for executor-caused defects, the remedy is to make acceptance probes declarable so they gate — NOT to buy a higher tier. An absent or non-discriminating probe is a machinery gap; escalation is the fallback only if declarable probes exist and the defect recurs anyway. The cohort is the next six, fixed at adoption, not a rolling window"
floor_measurement = "the trigger above is only evaluable if the data is recorded: each delegated change records which tier implemented it, and every review round is classified brief-caused, executor-caused, or integration-staleness. Only executor-caused rounds count against the floor. This is observational, not a controlled experiment — cause is not a structured verdict field and there is no high-tier counterfactual"
head_model = "opus-5 high leads: it plans, orchestrates, delegates, and synthesizes. It is also the roster ceiling — nothing accessible scores higher — so there is no escalation path above it. A slice it cannot land gets decomposed, better context, or a sideways second opinion from sol high, never a higher effort tier. Its leverage comes from spending sol low on specified labor rather than doing that labor itself"
quota_window = "the Claude window is the scarcer of the two and has no meter: keep the head model on judgment and push specified labor to the codex pool. Subscription quota is output tokens, not dollars, and opus-5 high spends 64k per task against sol high's 28k for the same class of result — so the cash column understates how much a Claude-side tier costs the window. Drop to opus-5 medium (37k out, same pass@1 as sol high) for routine leading in a long session. Start assigned implementation on sol low; Sol ultra and max are prohibited; fast mode is deliberate, never ambient"
user_facing = "opus-5 writes or reviews novel user-facing work: UX, copy, API shape, and final polish. Sol may implement against an already-settled design system, but novel design and final polish stay on the Claude taste axis"
review_generation = "defect generation and defect adjudication are separable and priced differently. Generation can run on a model far below the reviewer floor if it is given an adversarial brief — one that names the failure mode gates cannot catch, enumerates the defect classes to sweep, and refuses a bare 'no issues' by requiring each ruled-out class to name the file and reasoning. Adjudication cannot: every finding from a sub-floor generator is a candidate until a reviewer-tier model or the lead confirms it against source. Measured 2026-07-27: deepseek-v4-pro at 8% pass@1 produced six confirmed defects and two fully fabricated blocking claims in the same run. This does not add a reviewer tier and does not change who may issue a verdict"
review = "the verdict never comes from the model that authored the diff; reviewer tiers are exactly opus-5 high, sol high, and sol medium (sol low never reviews; sol xhigh authors, it does not review). opus-5-authored work: routine/docs none, behavior-affecting a sol medium read-only skim, high-stakes (migrations, schema/breaking, destructive, security) sol high mandatory. sol-authored work: opus-5 as lead reviews the diff, high-stakes adds a second sol high pass. When codex quota is exhausted, opus-5 high is the only reviewer left and a high-stakes verdict waits for the reset rather than being self-issued. Inactive futures grok-4.5 and kimi-k3 join the line only when activated"
