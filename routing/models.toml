notes = "Released 2026-09-29 as `gpt-6.1-sol` to Plus, Pro, Business, Enterprise, and Edu in Codex and ChatGPT Work, and on the API with a 1.05M context, 128k maximum output, and an April 2026 knowledge cutoff. The Codex pricing page (read 2026-09-29) estimates Plus at 15-160 local messages per five-hour window against GPT-6 Sol's 15-150. The Codex CLI 0.159.0 model cache lists efforts low through max plus ultra, defaults to low, and carries a 272k context (872k maximum); ultra is not carried as a tier. An Ultrafast Codex mode, up to 8x faster generation, was announced for the following days and is not carried either. Answered through `codex exec` at low and high, and through pi's `openai-codex` provider at low as a custom model id and at xhigh once declared in `models.json`, on 2026-09-29. OpenAI withheld a GPT-6.1 Astra over safety findings, so Astra remains on its 6.0 build. Field report: Theo Browne, \"OpenAI fights back\", t3.gg, 2026-09-29 (https://www.youtube.com/watch?v=vu8X3YroB-w), from early access; its author also runs the site the Artificial Analysis curve above was read from, so the two are not independent sources. See eras/2026-09-29-gpt-6-1-sol-takes-the-sol-seats.md"
