  pass_at_1 = 0.74
  usd_per_task = 11.84
  out_tokens = "118k"
  use = "prohibited: never select, including by explicit request. +1 point over high for +95% cost and 1.8x the output tokens, against a tier that already tops the roster"
  [[model.effort]]
  effort = "xhigh"
  pass_at_1 = 0.73
  usd_per_task = 9.07
  out_tokens = "92k"
  use = "prohibited: never select, including by explicit request. Identical pass@1 to high for +49% cost and 1.4x the tokens — it buys nothing measurable"
  [[model.effort]]
  effort = "high"
  status = "explicit-only"
  pass_at_1 = 0.73
  usd_per_task = 6.08
  out_tokens = "64k"
  use = "NOT RECOMMENDED. Available only when the user explicitly requests high; never auto-route or escalate to it. It buys 4 points over medium for +85% cash and +73% output tokens, while effort does not fix the verification weakness. Medium remains the routing ceiling even for judgment-dense UX, copy, API-shape, and taste work"
  [[model.effort]]
