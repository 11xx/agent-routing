  predecessor = "V4 Flash 0731"
  predecessor_pass_at_1 = 0.53
  predecessor_usd_per_task = 0.46
  use = "steered generation, through Pi, under a brief that fences what it may produce, and not the last model to touch anything that ships. Treat every factual claim and every identifier it emits as a candidate until checked against source: that is ordinary care on any unmeasured build, and it is the specific failure the predecessor exhibited. Two field arcs on the live build, 2026-09-18 and 2026-09-19, and the 0731 board row is still the predecessor's: neither its score nor the vendor's figure promotes this build. Together they show brief adherence over a two-hour unattended horizon, refusal to fabricate progress, and self-reported error correction, under a lead who probed every claim. They do not test approval, brief-less work, or a surface where a wrong answer passes every gate; an arc of that shape is what would move the seat. A fresh vendor number is not that arc"

