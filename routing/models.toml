# Model/effort routing matrix: the machine-readable view of the roster.
# The authored view is doctrine/model-routing.md, which `agent-routing doctrine`
# prints on demand; harness instruction files name that verb rather than
# embedding its output. Neither is generated from the other — each keeps
# something the other cannot express — so `agent-routing lint` compares the
# pass@1 and cost cells they share, their model coverage, and route structure,
# rather than asking anyone to remember to sync them. It reads neither
# document's prose.
# Access without a path: `agent-routing models`.
#
# A seated tier, one some stable profile route uses, carries `rank`: one
# positive integer per pool that seats it. Ranks are operator policy ordering
# tiers within a pool so a directed selection can be read as an upgrade or a
# downgrade; they are not measured capability and never compare across pools.
# The lint requires one on every seated tier and refuses one anywhere else.

[meta]
benchmark = "DeepSWE v1.1, 113 tasks; roster measured through 2026-09-02, with operator evidence added for Astra on 2026-09-05"
metric = "pass@1 / avg $ / output tokens"
updated = "2026-09-29"
pricing_update = "OpenAI cut standard short-context Terra token prices by 20% and Luna by 80% on 2026-07-30. Per-task costs below apply the uniform price change to the measured benchmark token mix; capability and output-token results did not change."
era_notes = "Opus 5.5 replaced Opus 5 as head model on 2026-09-22 on vendor evidence and operator direction, with no row of this matrix behind it. Opus 5 replaced Opus 4.8 on 2026-07-25 and took the head-model seat Fable 5 held. OpenAI's 2026-07-30 Terra/Luna price and credit reset moved the workhorse roles. DeepSeek V4 Flash 0731 reached general availability on 2026-07-31 while V4 Pro remained preview. Meta released Muse Spark 1.2 and the Muse Code harness on 2026-08-05, which enters as an unreachable future row rather than a routable tier. The Luna-implements/Sol-reviews cost share was measured on 2026-08-26 and changes no seat, only how many review passes are bought. The September 2026 releases entered on 2026-09-03: Fable 5.1 returned a Fable to the subscription as an unmeasured head candidate; Gemini 3.8 Flash, GLM 5.3, Grok 4.6, DeepSeek V4 Pro 0813, Muse Spark 1.2, DeepSeek V4 Flash, and GLM 5.3 Flash gained independent rows from the Datacurve board. Astra is now reported as available to the operator; operator evidence says low/medium may cover Sol-max-class work, medium looks most efficient, and high is the deliberate try-harder tier. Astra was priced on 2026-09-20 at $10/$1/$50 per million; its published 272k long-context surcharge is an API list-price term, not observed Codex subscription spend. The standard API input rate is exactly 50x Luna's, and a separate cost field arc recorded subscription quota observations; capability remains unprobed and no Astra route is promoted on a cost arc alone. DeepSeek's Flash line moved to the V4.1 build on 2026-09-17, served under the unversioned id `deepseek-flash` at 0.30/1.20 per million; the `generate` route and the roster row follow the provider id, and the 0731 build's board row stays predecessor evidence until V4.1 has one of its own. MiMo V2.6 Flash and Pro entered on 2026-09-22 as unmeasured probation rows reached through pi on the Go pool — Flash the standing benchmark subject, Pro the sibling the operator reads as a little stronger — with no profile and no score beside them. History in eras/ The GPT-6 family took every Codex-side seat on 2026-09-23 by operator direction: Luna for bounded work, Sol for judgment-bearing execution, Astra for planning and review; the 5.6 rows are superseded and DeepSeek V4 Pro is deprecated in favour of V4.1 Flash, which became pi's default for every GPT profile on the Go pool. Sonnet 5.5 entered on 2026-09-28 as an unmeasured trial row reached through the first-party Claude backend by operator direction, with no profile beside it. GPT-6.1 Sol took every GPT-6 Sol seat at the same tier on 2026-09-29 by operator direction, on an Artificial Analysis curve above its predecessor at every tier for no more per task, with its max tier explicit-only; the review seat moved to it from Astra medium the same day on a third-party field report, with Astra keeping plan and the high-stakes variants."
vendor_benchmarks = "a vendor's own harness produces its own scale, not a row on this one, and so does an aggregator board: the mini-swe-agent public board scores Opus 5 at 68.8% and Terra at 70.0% where this matrix measures 74% and 70% at max, so an aggregator figure is recorded as third_party_reported_deepswe and never as pass@1. The pass@1 column holds only rows the Datacurve board measured under its own harness — the one every existing row came from. Meta's launch numbers score Terra high at 64.8% and Opus 5 at 65.0% on nominally the same DeepSWE v1.1 where this matrix measures 54% and 73%; DeepSeek's 54.4% came from an unreleased minimal harness. Vendor figures are recorded as availability and direction-of-travel evidence and never merged into the pass@1 column"

