[[model]]
id = "sonnet-5.5"
family = "claude"
aliases = ["sonnet-5-5", "claude-sonnet-5-5"]
status = "experimental"
role = "trial candidate for Claude-side everyday coding, implementation, and routine review, unmeasured here and selected only by operator direction. No profile resolves to it and nothing degrades to it. It inherits nothing from sonnet-5, whose dominated record and restriction belong to that row"
character = "the Sonnet-tier model at $2 / $10 per million, with a steep effort curve: Artificial Analysis's launch-day Intelligence Index runs from 36 at low to 56 at max while Opus 5.5 runs 42 to 58 across the same tiers, so the gap between the two closes as effort rises and its cost per task rises faster ($0.41 to $7.60 against $0.55 to $5.98). On coding and knowledge work the vendor and independent boards place it near Opus 5.5 — FrontierCode 1.1 52.1% at xhigh against 54.4%, CursorBench 4.0 55.5% against 57.8%, and second on the Vals index at 69.22% against Opus's 69.69%, run at max. The comparison a trial is built around is Sonnet high (index 47, $1.08 per task) against Opus 5.5 medium (51, $1.34): close enough that failure style, repair rounds, latency, scope discipline, and window weight matter more than four index points. None of it is measured on this matrix, and every scale is another evaluator's harness"
weaknesses = ["no pass@1 on this matrix, so no effort tier is calibrated. Every figure is a launch-day observation kept with its evaluator and date; a rerun is a new observation and never overwrites one. Artificial Analysis reported a structured-output bug in its prerelease deployment, fixed afterwards, so its launch-day scores may understate the released model", "more effort is not always more capability. FrontierCode 1.1 scores the vendor's xhigh at 52.1% and its max at 46.2%: at max the agent invoked Claude Code's code-review skill more often, which spawned subagents, and the failures examined were timeouts and useful but out-of-scope edits, which the benchmark penalizes correctly. More reasoning changed the agent's behavior in a way that cost mergeable results, so a tier is read against its harness and evaluator and never alone", "one benchmark name, three harnesses: Terminal-Bench 4.0 reads 70.6% from the vendor, 64% at max from Artificial Analysis, and 53.0% at max from Vals. A score is stored with model, effort, harness, evaluator, and benchmark version, and none of these enters the pass@1 column", "the top tiers are token-hungry: Artificial Analysis reports roughly 193k output tokens per task at max, the most it had measured and about 60% above Opus 5.5 max, so the cash column understates wall-clock and window weight there. Claude subscription quota weight is unmeasured"]
api_price_per_million = { input = 2.0, cached_input = 0.20, output = 10.0 }
notes = "Released 2026-09-28 as `claude-sonnet-5-5` with five effort levels (low, medium, high, xhigh, max); Claude Code and the apps default to medium and the API to high. The vendor reports output speed more than 30% faster than Sonnet 5. Reachable on the Claude subscription through Claude Code and the first-party `claude` backend, the only route this roster serves it by, and selected by `agent-routing validate --profile <shape> --backend claude --model sonnet-5.5 --effort <tier> --provider anthropic --reason <text> --allow-experimental`. A profile is a standing default and a standing default needs a field record, so the selection is the trial record. Launch-day Artificial Analysis Intelligence Index v4.3.2, index / cost per task, Sonnet 5.5 against Opus 5.5: low 36 / $0.41 against 42 / $0.55; medium 41 / $0.59 against 51 / $1.34; high 47 / $1.08 against 54 / $1.82; xhigh 52 / $2.74 against 56 / $3.46; max 56 / $7.60 against 58 / $5.98. See eras/2026-09-28-sonnet-5-5-enters-on-trial.md"
  [[model.effort]]
  effort = "max"
  status = "explicit-only"
  use = "explicit selection only, as a bounded trial and never an escalation tier. On the operator's read it scales with effort, and the launch index agrees (56 against xhigh's 52), but at 2.8x xhigh's cost per task ($7.60 against $2.74) on the highest output volume Artificial Analysis had measured, roughly 193k tokens per task; Opus 5.5 xhigh reaches the same 56 for $3.46, and on the vendor's FrontierCode run max scored below xhigh (46.2% against 52.1%) because the agent fanned out into subagents and out-of-scope edits. Run it on a bounded task under a token or time cap and read the diff against the brief's scope ceiling; unmeasured here"
  [[model.effort]]
  effort = "xhigh"
  status = "explicit-only"
  use = "explicit selection only; unmeasured here. Index 52 at $2.74 against high's 47 at $1.08 at launch. Not an escalation tier: a slice high cannot land gets decomposed, better context, or a sideways second opinion, the rule the Opus 5.5 tiers carry"
  [[model.effort]]
  effort = "high"
  status = "probationary"
  use = "probationary trial tier, operator-directed only, and the one the first field comparison is about: high against Opus 5.5 medium on the same real work, read on accepted patches, repair rounds, wall time, window weight, output tokens, and scope discipline. Named brief, acceptance probes, and lead review; unmeasured here"
  [[model.effort]]
  effort = "medium"
  status = "probationary"
  use = "probationary trial tier, operator-directed only, and Claude Code's default for the model. The trial question is whether high buys enough over it to be the production Sonnet tier; unmeasured here"
  [[model.effort]]
  effort = "low"
  status = "explicit-only"
  use = "explicit selection only; unmeasured here. The cheapest tier, index 36 at $0.41 at launch, and no route asks for it"

