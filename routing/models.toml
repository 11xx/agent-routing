weaknesses = ["FIELD-MEASURED, 2026-09-20, 25 sessions / 2,924 requests / 768M input tokens across the Codex store: does not manage context. It runs the fattest context of any model measured on this machine — 262k billed per request against Luna 211k, Sol 126k — and the records show no pruning: monotonic growth in every session measured, ending above 300k in 40% of them. The reported cache-hit aggregate stayed at 97-98%; that aggregate does not identify how long any individual item remained cached or establish an exact token lifetime", "FIELD-MEASURED, 2026-09-20: Codex subscription quota burn showed no visible discontinuity at the API surcharge threshold in this corpus — 0.368 points per million input tokens in the 200-272k band against 0.425 just above it and 0.386 above 500k. The API term is not observed subscription spend and does not justify a Codex context cap. A counterfactual replay under a working-context cap costs 44% less at 200k and 57% less at 120k, entirely from carrying less; those figures are not promises or established optima because summary generation, cache effects, re-reading, task quality, and recovery costs were not measured. The evidence supports measuring session length and read width, not prescribing a cap", "FIELD-MEASURED, 2026-09-20: `apply_patch` is 16.3% of tool calls at low, 8.3% at medium, and 0.8% at high. This is an action-frequency observation from the corpus, not evidence of implementation capability or a reason to route high for writing. No controlled Astra implementation comparison or pass@1 exists", "the ~49x context re-send multiplier it carries is not distinctive — Luna carries the same one — but the 50x comparison is a published API-rate ratio, not a claim about Codex subscription consumption. Token-volume comparisons need the billing surface and model/effort boundary named"]
notes = "Priced 2026-09-20 from the vendor model page: $10 input, $1 cached input, $12.50 cache write, $50 output per million. Batch and Flex run at 50% of standard, Fast at 2x. The published long-context surcharge above 272k input tokens is an API list-price term; it is not observed Codex subscription spend, where the field records show no visible quota discontinuity at that threshold. The published API input rate is exactly 50x Luna's and the output rate 41.7x, but those ratios do not predict subscription consumption. Capability remains unprobed and no automatic profile names Astra; the field arc measures context and quota behavior, not pass@1 or implementation quality. The intended workflow is bounded Astra planning and review followed by bounded implementation through the current `implement` profile, which resolves to Luna max. This is a workflow description, not a capability or savings guarantee. An explicit session instruction to implement locally or not delegate is owned by the instruction layer and overrides that default. The current Codex client addresses the model as gpt-6-astra."
