# Narrative that the per-model fields cannot carry: the framing sentence and
# the vocabulary the matrix is read with. Kept here so the whole prose view has
# one source, rather than a generated table beside a hand-written preamble.
[prose]
intro = "Standing defaults for complementary Claude and Codex orchestration. **Opus 5 is the head model** — it plans, orchestrates, delegates, and owns the final answer — and Sol is the technical peer and execution axis beneath it. Delegation uses the other subscription where its model or quota is a better fit. Only models verified through current local backends are routed; probationary API models are labeled experimental. Availability history remains in `~/code/ai-agent-routing/eras/`."
glossary_intelligence = "how complex a problem the model completes correctly, unsupervised."
glossary_taste = "cleanliness of UI/UX, architectural code quality, API design, copy."
closing = "These are **defaults, not limits**, except where a model or effort is explicitly prohibited. Judge output rather than rank alone: Luna max carries bounded implementation and review, Sol technical judgment and persistence, and Opus planning, orchestration, taste, and synthesis. Machine-readable form: `agent-routing models` / `agent-routing delegation`; mechanism prose: `agent-routing mechanism`. Never route work through harness-native subagent defaults; invoke executors explicitly with stated model, effort, and a curated brief."

# Subscription quota: observed for Claude and published as credits for Codex.
# Re-measure observed figures when a plan or model changes. Do not extrapolate
# one provider's accounting onto another.
[quota]
method = "Claude uses observed share of one rolling window consumed by a session of known token count. OpenAI publishes Codex credits per million input, cached-input, and output tokens plus approximate messages per five-hour window."
weighting = "MODEL-WEIGHTED on both subscriptions. Claude evidence is observed: the same ~500k uncached tokens consumed ~15% of a window on opus-5 and ~30% on fable-5. Codex evidence is explicit and exactly cost-weighted: every token class for Sol, Terra, and Luna costs 25 credits per API dollar, so task-level credit ratios equal the benchmark cash ratios."
claude_plan = "Max, 5h rolling window plus a weekly cap. The ratios below were observed on Pro $20 and transfer as ratios, not as window sizes"
claude_opus_5 = "~500k uncached tokens ~= 15% of one window, so roughly 3.3M uncached tokens per window"
claude_fable_5 = "~500k uncached tokens ~= 30% of one window when it was still on the subscription: opus-5 does the same work for about half the quota"
claude_fable_5_1 = "metered like Fable 5 and capped at half of a Max plan's weekly allowance; its ratio against opus-5 on this plan is unmeasured, and the Fable 5 figure is the working assumption until it is"
caching = "these are UNCACHED figures; a cache-warm session stretches the window substantially, which is why long single-context arcs beat repeated cold re-derivation"
codex_pool = "ChatGPT Work and Codex share one five-hour window across the codex CLI and pi's openai-codex login. Official Plus estimates are Sol 10-100, Terra 25-200, and Luna 250-2,000 local messages per five hours; these approximate ranges are not exact transforms of the credit schedule because use varies with context, reasoning, tools, retrieval, and caching."
opencode_go_pool = "CONDITIONAL, not standing: an optional $10/month subscription reached through the opencode CLI, drawing on neither of the two pools above. Limits are denominated in usage dollars rather than credits or observed share — $12 per five hours, $30 weekly, $60 monthly — so the benchmark cash column converts directly into per-window capacity instead of needing a separate transform. Alone among the three pools it is locally measurable: `opencode stats` reports cumulative spend and `--format json` reports per-step token counts. Nothing degrades to it automatically; a lapsed subscription is a stop, not a fallback."

[policy]
effort_cliff = "the 5.6 family degrades steeply on agentic work at low effort. Luna's curve is the steepest on the board (2% low to 67% max): low/medium remain bounded function-shaped calls, while high and above remain non-stable planned-execution tiers until controlled field evidence lands. Never generalize one Luna tier's behavior from another"
horizon = "task distance is a routing axis the pass@1 column does not carry. A model's error is set at the start, when it interprets what the target actually is, and the longer the arc the further a small misreading compounds — the same misinterpretation that is harmless over a five-line change lands somewhere unrecognisable at the end of an unattended hour. Two consequences. Cheap tiers are safe over short distances almost regardless of how well they interpret, which is why bounded slices route down and broad ambiguous arcs do not. And the cost of an underspecified target is paid in proportion to arc length, so specification effort belongs where the arc is long, not where the task is hard. This is what the delegation ladder already prices as residual risk after the gate; naming the axis keeps the reason legible when a cheap tier looks tempting for a long run"
non_scaling_tops = "every family stops paying before its top tier, so 'tops the bench' is never a reason to select one. opus-5 medium is the routing ceiling; high remains available only by explicit user request, while xhigh buys 0 points over high for +49% and max buys 1 for +95% and both are prohibited. sol xhigh is its hard ceiling; ultra and max are prohibited"
prohibited = "never select, including on explicit request: opus-5 xhigh, opus-5 max, sol ultra, sol max. Opus-5 medium is the routing ceiling; high is available but not recommended and is never selected automatically"
delegation_effort = "priced by residual risk after the gate, not by handoff ambiguity: Luna max is the stable default for source-verified bounded work, from fully pre-resolved slices through ordinary implementation judgment. Luna high remains benchmarked but is not routed because max gains 23 pass@1 points while remaining cheaper than Terra high. Escalate to Sol medium or high when the brief leaves deeper architecture, API, or semantic judgment, or when no discriminating command exists. Sol xhigh is its hard ceiling; Sol ultra and max are prohibited. Migrations, schema/breaking changes, destructive operations, and security keep the high-stakes Sol-high floor regardless of specification quality"
acceptance_probes = "the mechanism that makes the executor floor safe: every implementation brief routed below the Sol-high floor names acceptance probes as runnable commands, and the executor records each at the final head with `arc verify --command` so the evidence lands in the ledger. Loudness is constructed by the lead, not bought with a higher tier — naming a probe requires knowing the required behavior, not predicting the executor's mistake. Caveat to state rather than gloss: readiness consults declared gates only, so ad hoc probe evidence never gates and never turns green; the convention is reviewer-enforced, and a reviewer who assumes the tool is checking will stop checking"
floor_failure_response = "pre-registered so the reflex does not decide it: if a workhorse-authored semantic defect passes its named probe and first review, or two of the fixed next-six workhorse cohort need extra verdict rounds for executor-caused defects, the remedy is to make acceptance probes declarable so they gate — not to buy a higher tier. An absent or non-discriminating probe is a machinery gap; escalation is the fallback only if declarable probes exist and the defect recurs anyway. Changing the workhorse model does not silently reset the cohort"
floor_measurement = "the trigger above is only evaluable if the data is recorded: each delegated change records the exact model and effort that implemented it, and every review round is classified brief-caused, executor-caused, or integration-staleness. Only executor-caused rounds count against the floor. This is observational, not a controlled experiment — cause is not a structured verdict field and there is no counterfactual executor"
head_model = "opus-5 medium leads: it plans, orchestrates, delegates, and synthesizes at the routing ceiling. High remains available only when the user explicitly requests that effort; it is not an escalation tier. A slice medium cannot land gets decomposed, better context, or a sideways second opinion from sol high rather than an automatic effort increase"
quota_window = "the Claude window remains the scarcer pool, so keep the head model on judgment and push specified labor to Codex. OpenAI's schedule prices every model at 25 credits per API dollar, so benchmark cash ratios transfer directly into task-level credits; official Plus estimates are Sol 10-100, Terra 25-200, and Luna 250-2,000 local messages per five hours. Route bounded labor to Luna max, and spend Sol only where technical judgment or token-efficient persistence earns its rate. Codex fast mode consumes 2.5x credits; Claude fast mode burns its window substantially faster. Both stay deliberate, never ambient"
user_facing = "opus-5 writes or reviews novel user-facing work: UX, copy, API shape, and final polish. Sol may implement against an already-settled design system, but novel design and final polish stay on the Claude taste axis"
review_generation = "defect generation and defect adjudication are separable and priced differently. Generation can run on a model below the reviewer floor if it is given an adversarial brief — one that names the failure mode gates cannot catch, enumerates the defect classes to sweep, and refuses a bare 'no issues' by requiring each ruled-out class to name the file and reasoning. Adjudication cannot: every finding from a sub-floor generator is a candidate until a reviewer-tier model or the lead confirms it against source. Measured 2026-07-27: the V4 Pro preview at 8% pass@1 produced six confirmed defects and two fully fabricated blocking claims in the same run. V4 Flash 0731's vendor-reported improvement does not add a reviewer tier or change who may issue a verdict; independent 2026-08-01 testing puts its hallucination rate at 84% and shows it fabricating on every run of an agentic task, which is why it generates candidates and never adjudicates them. Generation is also where its speed, million-token context, and price actually pay: breadth is cheap and a lead is doing the ruling-out anyway"
review = "the verdict never claims independence from the model that authored the diff; a lead reviewing delegated work it did not author is valid coverage. Independent review is an escalation for policy, explicit user requirements, or high-consequence approvals, and routine deferred coverage is recorded as Arc debt. Concrete reviewer routes come from profiles and current roster data rather than this frozen sentence. Debt never overrides changes-requested"
