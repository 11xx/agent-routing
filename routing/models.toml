  pass_at_1 = 0.69
  usd_per_task = 3.29
  out_tokens = "37k"
  use = "THE DEFAULT LEAD TIER AND ROUTING CEILING. Matches sol high's 69% at 37k output tokens against opus-5 high's 64k, so on a cost-shaped window it does the same class of work for roughly half the consumption. Planning, orchestration, delegation, ceremony, review, cleanup, novel UX/copy, and API shape all stay here unless the user explicitly asks for high"
  [[model.effort]]
