[[model]]
id = "deepseek-v4-flash"
family = "deepseek"
status = "experimental"
role = "high-volume steered generator, never an implementer of record. Its output is raw material a lead or reviewer-tier model extracts from — candidates to rule out, drafts to mine, breadth to sweep — and nothing it produces ships as written. Speed, a million-token context, and cheapness make it good at producing a lot; a measured fabrication rate makes it unfit to be believed"
character = "genuinely strong and genuinely untrustworthy at the same time, and both halves are load-bearing. DeepSeek reports 54.4 on DeepSWE at max effort using its own unreleased Harness minimal mode — vendor evidence, not a pass@1 row comparable to this matrix. It is materially re-post-trained for agent work over the April preview, and independent testing agrees the coding scores beat that preview and many other models. The same testing measures why it still cannot be trusted unsupervised"
weaknesses = ["FIELD-REPORTED, 2026-08-01 (independent single-reviewer testing, not a neutral benchmark): fabricates confidently and reproducibly. On an agentic Splunk CTF question it invented an answer on EVERY run across max and high reasoning and temperatures from 1.0 down to 0.6 — once echoing the example key out of the prompt, once inventing a secret absent from the searched data. Qwen3 27B, Tencent Hi3, MiniMax, and Inkling did not fail this way", "Artificial Analysis reports an 84% hallucination rate for this build (the V4 Pro preview: 94%)", "ignores explicit plan instructions: given a plan whose first line pinned a specific dependency version, it pinned a different one. A fully pre-resolved brief is therefore no protection — the brief is what it disregarded", "verbose to the point of noise: materially more lines of code and more tests than better-scoring models on the same task, while scoring worse. Volume is not effort", "on a long-horizon plan-execution task (many tool calls over 20-60 minutes) it scored below Tencent Hi3 at both efforts — Hi3's LOW effort beat this model's HIGH, and Hi3 beat its max. Reproduced across two harnesses, so not a harness artifact"]
api_price_per_million = { cache_hit_input = 0.0028, cache_miss_input = 0.14, output = 0.28 }
notes = "Live-probed through pi 0.83.0 on 2026-07-31, the day it went generally available. Release was API-only; the DeepSeek app/web model was unchanged. V4 Pro's final release is still pending. Reachable on more than one pool, and the pools differ in retention posture rather than in capability: zero-retention routes exist at some providers, while the opencode-go route is gated behind an explicit China-hosting opt-in and stays unrouted until the operator takes it. The weights are open, so a fourth posture exists that the hosted pools cannot offer: run it locally and no third party sees the prompt at all. That changes who holds the data, never whether the output can be believed — a locally hosted fabricator fabricates identically."
open_weights = true
niches = ["the open-weight route carries no frontier refusal surface, which makes it the practical choice for authorized security work — probing one's own systems for vulnerabilities — where hosted frontier models lecture, refuse, or degrade mid-task. Authorization is the operator's to establish; the model will not ask", "generation quality responds to exemplars rather than to constraints. Out of the box its code is functional and graceless, and the fix is showing it what the target should look like. Briefs that fence what it may not do get verbose noise; briefs carrying concrete style references get usable raw material", "field reports credit it with real medium-horizon agency — orchestrating subagents, checking its own work, catching and correcting its own wrong turns. That is compatible with everything measured here and changes nothing: the ceiling on its use is trust, not capability, and horizon buys no trust"]
  [[model.effort]]
  effort = "max"
  vendor_reported_deepswe = 0.544
  use = "steered generation only, through Pi, under a brief that fences what it may produce. Never the implementer of record, never the reviewer of record, never a planner, and never the last model to touch anything that ships. Every factual claim and every identifier it emits is a candidate until checked against source, because its failure mode is confident fabrication rather than visible error. Do not promote it on vendor results alone"

