[[model]]
id = "opus-4.8"
family = "claude"
status = "superseded"
role = "replaced by opus-5 on 2026-07-25 across every role it held; never select. Opus 5 beats it by 21 points at high (73% vs 52%) for $6.08 against $4.28, and its max tier (59%) loses to opus-5 low plus a delegate."

[[model]]
id = "fable-5"
family = "claude"
status = "retired"
role = "no subscription route: reachable only by direct credit billing, at a cost the user has ruled prohibitive. Never route to it, never offer it as an escalation, and do not treat 'still accessible' as available. opus-5 holds the taste/intent/orchestration seat it used to."
notes = "kept as a row so its retirement is not relitigated. Retirement costs nothing on the benchmark: opus-5 beats fable at every comparable effort (73% vs 69% high, 74% vs 70% max) for roughly a third of the cash and half the subscription quota. The user's field read that Fable held a ceiling on genuinely novel hard reasoning is not contradicted by this — deepswe measures bounded SWE tasks, not that ceiling — but no accessible model exposes it any more."

[[model]]
id = "gpt-5.5"
family = "gpt-5.5"
status = "deprecated"
role = "every tier dominated by a cheaper 5.6 tier; never select"

