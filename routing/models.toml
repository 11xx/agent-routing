# Model/effort routing matrix: the machine-readable view of the roster.
# The authored view is doctrine/model-routing.md, which `agent-routing doctrine`
# prints on demand; harness instruction files name that verb rather than
# embedding its output. Neither is generated from the other — each keeps
# something the other cannot express — so `agent-routing lint` compares the
# pass@1 and cost cells they share, their model coverage, and route structure,
# rather than asking anyone to remember to sync them. It reads neither
# document's prose.
# Access without a path: `agent-routing models`.

[meta]
benchmark = "DeepSWE v1.1, 113 tasks; roster measured through 2026-07-27"
metric = "pass@1 / avg $ / output tokens"
updated = "2026-08-07"
pricing_update = "OpenAI cut standard short-context Terra token prices by 20% and Luna by 80% on 2026-07-30. Per-task costs below apply the uniform price change to the measured benchmark token mix; capability and output-token results did not change."
era_notes = "Opus 5 replaced Opus 4.8 on 2026-07-25 and took the head-model seat Fable 5 held. OpenAI's 2026-07-30 Terra/Luna price and credit reset moved the workhorse roles. DeepSeek V4 Flash 0731 reached general availability on 2026-07-31 while V4 Pro remained preview. Meta released Muse Spark 1.2 and the Muse Code harness on 2026-08-05, which enters as an unreachable future row rather than a routable tier. The Luna-implements/Sol-reviews cost share was measured on 2026-08-26 and changes no seat, only how many review passes are bought. History in eras/"
vendor_benchmarks = "a vendor's own harness produces its own scale, not a row on this one. Meta's launch numbers score Terra high at 64.8% and Opus 5 at 65.0% on nominally the same DeepSWE v1.1 where this matrix measures 54% and 73%; DeepSeek's 54.4% came from an unreleased minimal harness. Vendor figures are recorded as availability and direction-of-travel evidence and never merged into the pass@1 column"

[[model]]
id = "opus-5"
family = "claude"
role = "primary lead and default head model: planning, orchestration, taste, inferred intent, novel UX/copy, API and architectural ergonomics, simplification, and user-facing review; synthesizes delegated work and owns the final answer"
character = "tops the roster: high beats every Sol tier including sol max, and beats Fable at every comparable effort for a fraction of the cost. Field evidence adds one thing the benchmark does not measure — it is a smaller model than Fable and lacks Fable's ceiling on genuinely novel hard reasoning. Both readings are true; deepswe measures bounded SWE tasks, not that ceiling. It gains more from cheap workhorses than Fable did, so decompose-and-delegate is how it earns its cost."
weaknesses = ["medium is the routing ceiling: high buys only 4 points for +85% cost and remains available only when the user explicitly names it; xhigh and max are prohibited", "as head model it authors most planning and taste work, so the reviewer line matters more, not less: never let it review its own diff", "token-hungry relative to Sol at the same pass@1 (high: 64k out vs sol high 28k)", "FIELD-MEASURED, 2026-07-27/28: high rate of confident action on unverified substrate. In one long session: assumed org-babel expands #+INCLUDE (it does not, and would have tangled a literal keyword into four harness files); assumed cross-file noweb references resolve (they expand to nothing, silently); read a `grep | head -6` as a complete set and briefed an executor with 5 of 12 call sites; wrote `arc $cmd` unquoted under zsh twice, so two probes measured nothing and one wrong conclusion was drawn before the shell behaviour was noticed; delegated ledger-writing work into a codex sandbox that cannot write the ledger, a constraint already recorded in its own memory. Every one was caught before shipping, none by the model noticing on its own - by diffing, by testing, or by an executor stop condition. The reasoning was sound each time; the substrate was unchecked", "FIELD-MEASURED, 2026-08-26: the same unverified-substrate failure, in its most expensive form yet — overriding an explicit user instruction because of a capacity it assumed the environment had. Told to review ten changes in one sweep, it split them into three parallel passes plus two more later, judging ~3,800 diff lines too large for one reviewer context. Measured afterwards: the combined diff was 63k tokens against a `model_context_window = 1000000` set in a config file already on disk. Two commands (`git diff | wc -c`, and reading the config) would have settled it. Cost of the deviation: five `sol#high` passes at ~$107 where one is ~$37, on a session where review was 43% of tokens and 92% of spend. It also reported the session in token counts, which inverted the conclusion — it called implementation the expensive half when implementation was 8% of the bill. Two rules follow, both in its harness fragment: a user instruction outranks a model of the environment, so check the environment claim first; and fan-out is priced by rate times volume, never by run count", "orchestration mechanics are a distinct weak axis from reasoning: a Sonnet proxy subagent it spawned improvised a poll loop waiting on a status file the harness never writes, and hung. Drive long-running delegations directly with a backgrounded call, never through a proxy agent that can improvise its own wait"]
  [[model.effort]]
