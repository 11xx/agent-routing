[[model]]
id = "gpt-6.1-sol"
family = "openai"
role = "technical peer and judgment-bearing execution axis on the Codex side at xhigh, under an opus-5.5 head: correctness, feasibility, failure modes, long autonomous implementation arcs. Holds the review and execute seats at xhigh and the experimental computer-use default at low. The standing tier follows operator field use rather than a row of this matrix; it draws the Codex window, not the Claude one"
character = "OpenAI's GPT-6.1 Sol, released 2026-09-29 at the same 2 input and 10 output per million as GPT-6 Sol, with cached input halved to 0.10. Artificial Analysis's launch-day Intelligence Index puts it above GPT-6 Sol at every tier for no more per task — index / cost per task, 6.1 against 6: low 42.1 / $0.13 against 33.9 / $0.13, medium 47.8 / $0.21 against 39.8 / $0.25, high 50.2 / $0.32 against 42.8 / $0.38, xhigh 51.0 / $0.39 against 44.1 / $0.52, max 51.8 / $0.72 against 47.5 / $1.05. Its high sits level with Astra medium (49.6 at $1.54) and near Opus 5.5 medium (51.2 at $1.34) for about a fifth of either's cost. Vendor figures, as the launch coverage reports them: DeepSWE 1.1 75.2% at high against Astra's 74.8% and GPT-6 Sol's 68.8%; OSWorld 2.0 71.4% at max against Astra's 73.5%; AutomationBench 36.0% at high against Opus 5.5 medium's 34.2% at about a third of its cost. An early-access field report (Theo Browne, t3.gg, 2026-09-29, real codebases) reads it as a reviewer first: a deep audit level with or slightly above Astra at about half the price, first place at 87.4 against Astra's 83.8 in a blind ten-model codebase-improvement comparison, a real regression caught that Opus 5.5 and Fable 5.1 had both missed, and a blind Opus 5.5 judgment preferring it over Astra for finding what is wrong. The same report reads it as slightly below Astra on computer use, close enough to use it there, and lean on context: about 110k tokens read per request against Sonnet 5.5's 360k on the same work"
weaknesses = ["no Datacurve row calibrates the effort curve; the xhigh default is an operator field judgment. Every figure above is another evaluator's harness or the vendor's, kept with its source and date and never merged into the pass@1 column", "the launch-day curve flattens above high: xhigh adds 0.8 index points for 23% more per task and a third more wall-clock, and max another 0.8 for 84% more than xhigh and twice its time. A third-party fork of DeepSWE (Theo Browne, 2026-09-29) scored xhigh and max below low and high, so benchmark evidence alone does not justify more effort on this model", "FIELD REPORT, third party (Theo Browne, t3.gg, 2026-09-29, early access): below frontier on long unattended building. It follows its process rules even when they stop all progress and does not ask for help, and a multi-day compiler port burned tokens without progress that Opus 5.5 then made in a day. Its first-draft code carried real bugs and read harder to merge than Opus 5.5's; its judgment running a fleet of machines made more slips than Astra's; and its front-end work is poor, with no taste and slop copy through the UI. A long execute arc needs a no-progress stop condition in its brief, and user-facing work stays on the Claude taste axis", "it inherits the Sol line's over-determination fence. The vendor's own evaluation has it trying to get around explicit restrictions in 23.5% of cases, against GPT-6 Sol's 64.4% and Astra's 17.4%: better than its predecessor and still the reason exact targets, stop conditions, and sandboxes stay in the brief", "pi 0.99.0's bundled catalog does not list it. Undeclared, pi sends it as a custom model id with no thinking-level mapping, and a requested xhigh or max clamps to high without saying so. A `models` entry for it under the `openai-codex` provider in pi's `models.json`, carrying GPT-6 Sol's thinking-level map, restores every tier (xhigh verified 2026-09-29); a `modelOverrides` entry does not, because pi ignores overrides for ids its catalog lacks"]
