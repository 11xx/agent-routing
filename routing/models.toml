role = "benchmarked but unreachable: no probed backend. high scores 54% at $2.42 / 36k out — the opus-4.8-high band the earlier estimate predicted, and dominated by sol medium (61% at $1.86). Activating it would add a cheap second-opinion voice, not a new capability tier"
notes = "a first-party harness exists — the Grok Build CLI, field-reported as among the better frontier-lab CLIs — so the blocker is an unrun probe rather than an absent mechanism. Field reports also place it with the short-horizon models: fast, cheap, and reliable across small distances, falling off over long autonomous arcs. Probing it would be onboarding a backend, which the checklist in `agent-routing delegation` governs; the capability case for doing so remains weak"

[[model]]
