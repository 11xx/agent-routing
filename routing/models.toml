[[model]]
id = "deepseek-flash"
family = "deepseek"
role = "pi's default route for every GPT profile, by operator direction, reached on the OpenCode Go pool as `deepseek-v4.1-flash`, and the steered-generation route on the same pool. Five field arcs on the build in service back the seat: stacked implementation slices under a lead, an eighteen-slice unattended run, eight parallel changes across six repositories, twelve changes across five parallel lanes beside Luna, and ten implementation slices across four repositories; some earned approval on first read, and no identifier was fabricated in anything a lead probed. The predecessor's fabrication record is why every identifier it emits is still checked against source"
character = "the live build is V4.1 Flash, and the 53% / $0.46 board row together with the predecessor observations in the weaknesses below belong to the V4 Flash 0731 build it replaces. DeepSeek reports 54.4 on DeepSWE at max effort for that predecessor using its own unreleased Harness minimal mode — vendor evidence, not a pass@1 row comparable to this matrix. The family's direction across builds is upward, and each release has been reported stronger than the one before it; none of that is measured here. The seat rests on the live build's own field arcs, and the predecessor record is why every identifier it emits is still checked against source"
weaknesses = ["PREDECESSOR EVIDENCE, V4 Flash 0731, field-reported 2026-08-01 (independent single-reviewer testing, not a neutral benchmark): fabricated confidently and reproducibly. On an agentic Splunk CTF question it invented an answer on EVERY run across max and high reasoning and temperatures from 1.0 down to 0.6 — once echoing the example key out of the prompt, once inventing a secret absent from the searched data. Qwen3 27B, Tencent Hi3, MiniMax, and Inkling did not fail this way", "PREDECESSOR EVIDENCE: Artificial Analysis reported an 84% hallucination rate for the 0731 build (the V4 Pro preview: 94%)", "PREDECESSOR EVIDENCE: it ignored explicit plan instructions — given a plan whose first line pinned a specific dependency version, it pinned a different one. That is why a pre-resolved brief bought no safety on that build: the brief is what it disregarded", "PREDECESSOR EVIDENCE: verbose to the point of noise — materially more lines of code and more tests than better-scoring models on the same task, while scoring worse. Volume is not effort", "PREDECESSOR EVIDENCE: on a long-horizon plan-execution task (many tool calls over 20-60 minutes) it scored below Tencent Hi3 at both efforts — Hi3's LOW effort beat that build's HIGH, and Hi3 beat its max. Reproduced across two harnesses, so not a harness artifact", "THE LIVE BUILD HAS FIVE FIELD ARCS, and this is the entry that governs the five above. Every one of them was observed on V4 Flash 0731, which V4.1 Flash replaces, and the 53% / $0.46 board row is the predecessor's. They are not findings about the build in service. On 2026-09-18 V4.1 implemented three stacked slices in an unfamiliar 50k-line Rust CLI under an Opus lead: 7 commits, ~2,100 lines, gates green at every patchset, two blocking findings in one of three slices, both repaired on the first return with probes that failed beforehand for the predicted reason. It bettered the brief's mechanism, argued a design call it was invited to argue and won it, and disclosed an attribution error against itself that nothing obliged it to report. No fabricated identifier, API, or test result appeared in anything the lead probed. On 2026-09-19 it then ran an eighteen-slice batch unattended for 2h11m: 17 slices landed with gates green at every patchset, one stopped correctly on a verified premise failure rather than fabricating progress, zero executor-caused defects survived review, and its one slip — snapshotting on the wrong branch — it repaired and reported unasked. On 2026-09-22 it ran eight independent changes across six repositories and four languages off the OpenCode Go pool, seven of them in parallel: 4 to 25 minutes each and $0.88 for all eight plus one repair round. Seven were approved on first read. The one executor-caused defect, a latency distribution sampling 22 of 96 requests, passed its own probe, was caught by the lead against real data, and was repaired in one round. It disputed two of the lead's premises and was right both times, and disclosed an inherited-identity leak that it and three sibling runs noticed and worked around. Its largest change, 1,525 lines, held under live refusal probing. The predecessor's two measured failures, fabrication and long-horizon plan loss, appeared in none of the five arcs. None tests approval or brief-less work, and the third relaxed the never-the-last-edit footing by operator direction rather than earning it; the operator seated it on pi's defaults on that record rather than on an approval test. See eras/2026-09-18-deepseek-flash-v41-fork-fix-field-arc.md, eras/2026-09-19-deepseek-flash-v41-long-horizon-batch.md, and eras/2026-09-22-deepseek-flash-v41-go-pool-parallel-batch.md", "FOURTH ARC, 2026-09-25: five parallel lanes beside GPT-6 Luna max, twelve changes in 35–57 minutes per lane; two major and one minor findings, all brief-shaped, each repaired in one round; argued three designs against the brief and won all three; took over two Luna lanes from a lead's uncommitted work after a Codex outage and corrected the lead's mistakes in it. See eras/2026-09-25-luna-and-deepseek-workhorses-side-by-side.md", "FIFTH ARC, 2026-10-02: four DeepSeek V4.1 Flash lanes in a ten-slice, four-repository series beside GPT-6 Luna: S3a reader (two review rounds), S5 deploy (two; finished Luna's draft), S3b reader wiring (two), and S8 drop Sites (one). It mutation-checked regression tests against pre-fix code unprompted, reported brief contradictions precisely, committed in clean per-finding slices, and measured overflow widths and counts; no identifier was fabricated in anything the lead probed. See eras/2026-10-02-luna-deepseek-parallel-front-end-series.md", "A SELF-CHOSEN UNBOUNDED SEARCH CAN STALL A RUN, observed 2026-09-26 on a read-only review through Pi: to confirm a fact it had already read, it issued a recursive search of the whole home directory. Pi runs that search with no deadline, so the run sat for 18 minutes with a live process and a silent session, indistinguishable from a long turn, until the lead read the session tail and killed the search; it then finished a sound review. One of five runs in that sweep. Bound where a DeepSeek run may search in its brief, and supervise it by the recording rather than by the process"]
api_price_per_million = { cache_hit_input = 0.006, cache_miss_input = 0.30, output = 1.2 }
notes = "Also reached on the OpenCode Go pool as `deepseek-v4.1-flash` through each GPT profile's `deepseek-go` variant, pi's default by operator direction; the Go pool bills it in usage dollars against that subscription's windows rather than the direct provider's API account. Reached through pi as `--provider deepseek --model deepseek-flash`: the unversioned id is the one the provider carries across point releases, and the versioned id it replaces is deprecated. Live-probed through the `generate` delegation path on 2026-09-18, which the API answered as `deepseek-flash`. The V4.1 list price is roughly twice the 0731 cache-miss input and four times its output, so the generator costs materially more per task than the $0.46 the board measured on the predecessor. Reachable on more than one pool, and the pools differ in retention posture rather than in capability: zero-retention routes exist at some providers, while the opencode-go route is hosted in China and runs only while the workspace's data-residency opt-in is on: it refused the predecessor on 2026-08-01 with the setting off and served V4.1 as `deepseek-v4.1-flash` on 2026-09-22 with it on. The setting is the operator's, and delegating there sends repository context there; the route is each GPT profile's `deepseek-go` variant. The weights are open, so a fourth posture exists that the hosted pools cannot offer: run it locally and no third party sees the prompt at all. That changes who holds the data, never whether the output can be believed — a locally hosted fabricator fabricates identically."
open_weights = true
niches = ["the open-weight route carries no frontier refusal surface, which makes it the practical choice for authorized security work — probing one's own systems for vulnerabilities — where hosted frontier models lecture, refuse, or degrade mid-task. Authorization is the operator's to establish; the model will not ask", "generation quality responds to exemplars rather than to constraints. Out of the box its code is functional and graceless, and the fix is showing it what the target should look like. Briefs that fence what it may not do get verbose noise; briefs carrying concrete style references get usable raw material", "field reports credit it with real medium-horizon agency — orchestrating subagents, checking its own work, catching and correcting its own wrong turns. That is compatible with everything measured here and changes nothing: the ceiling on its use is trust, not capability, and horizon buys no trust"]
  [[model.effort]]
  effort = "max"
  rank = { "opencode-go" = 1 }
  predecessor = "V4 Flash 0731"
  predecessor_pass_at_1 = 0.53
  predecessor_usd_per_task = 0.46
  use = "steered generation, through Pi, under a brief that fences what it may produce, and not the last model to touch anything that ships. Treat every factual claim and every identifier it emits as a candidate until checked against source: that is ordinary care on any unmeasured build, and it is the specific failure the predecessor exhibited. Five field arcs on the live build — 2026-09-18, 2026-09-19, 2026-09-22, 2026-09-25, and 2026-10-02 — and the 0731 board row is still the predecessor's: neither its score nor the vendor's figure promotes this build. The fifth arc covered ten implementation slices across four repositories; its four DeepSeek lanes were approved after two, two, two, and one review rounds. Together they show brief adherence over a two-hour unattended horizon, refusal to fabricate progress, self-reported error correction, and design disputes won against the brief, under a lead who probed every claim. They do not test approval, brief-less work, or a surface where a wrong answer passes every gate; an arc of that shape is what would move the seat. A fresh vendor number is not that arc"

