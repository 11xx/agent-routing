notes = "field reports independently place it among the few models that hold a long autonomous arc, and attribute that to raw scale. That is the axis the pass@1 column cannot see, and it is why this row outranks the other inactive ones for a probe"

[[model]]
id = "muse-spark-1.2"
family = "meta"
status = "experimental"
role = "probationary adversarial reviewer on the free contributor tier, never the reviewer of record alone. Still no probed implementation backend and no independent pass@1; what changed is one measured review arc, not the capability estimate. Third-party index scoring places it level with grok-4.5 and the opus-4.8 band, which sol medium dominates at 61% for $1.86"
character = "FIELD-MEASURED, 2026-08-23, review only: it graded a defect BLOCKING that a second independent reviewer, reading the same diff under the same brief, graded merely medium — and the stricter grade was right. The defect was a derived view built on the newest verdict rather than the gating one, so any later record silently dropped an outstanding obligation. It reasoned to the failure from the diff alone, with no repository access, and wrote the concrete state sequence that produced it. On the following round it named a residual that turned out to be a live hole when the states were actually run. Its willingness to grade BLOCKING is the trait worth routing for: an agreeable reviewer is worth nothing. Separately, a coding-specialised model on a fast release cadence — third at four-month intervals, with its index score climbing steadily across them. Direction of travel is the interesting part; the current position is not"
weaknesses = ["FIELD-MEASURED, 2026-08-23: verbose to the point where the report costs more to read than it saves. On the same task it emitted roughly twice the reviewer peer's output, much of it re-quoting the diff back with inline evidence labels on every clause. Budget reading time, and prefer it where thoroughness beats brevity", "FIELD-MEASURED, 2026-08-23: seven independent discussion positions, all `amend`, none `for` or `against` — the identical uniform stance the other probationary model produced on the same seven questions. Two unrelated models hedging the same way is evidence about the prompt or about the discussions, not about either model; until that separates, a lone `amend` from either is weak evidence", "unmeasured in the direction that matters most for a reviewer: it has produced no approval whose correctness another reviewer confirmed, so whether it approves what it should not is untested", "every launch number is vendor-run in a vendor harness whose own methodology says its tools and prompts may not suit third-party models. That harness scores Terra high at 64.8% and Opus 5 at 65.0% on nominally the same DeepSWE v1.1 where this matrix measures 54% and 73%, so its 59.3% is not a row on this scale", "the preceding version published a Terminal-Bench figure that verified 3.8 points lower — a gap wider than the reported confidence interval — so vendor numbers here have a measured optimism, not merely a theoretical one", "the cheap tier is paid for in training rights over the code sent to it, which is a licensing decision rather than a routing one and cannot be made per-task", "the harness is closed and login-gated, with no published account of what leaves the machine, and ships for macOS and Linux only"]
api_price_per_million = { input = 1.25, cached_input = 0.15, output = 4.25 }
contributor_tier_per_million = { input = 0.10, cached_input = 0.002, output = 0.20 }
  [[model.effort]]
  effort = "xhigh"
  status = "probationary"
  use = "probationary adversarial reviewer and discussion participant on the free contributor tier, under an explicit refutation brief. Never the reviewer of record alone: pair it with a second reviewer, or have a lead verify each blocking finding against source. Never an implementer, never a planner. It pairs well with ox-alpha specifically because the two graded the same root defect differently and each found things the other missed"
notes = "Live-probed through pi on 2026-08-23 via `--provider opencode --model muse-spark-1.2-contributor-free`, free at the point of use, which is why it was run nine times in one session. Promotion out of probation needs an independent pass@1 and a confirmed approval — the bar Luna max cleared. The contributor tier's training-rights cost is a licensing decision the operator has already taken for review work; it is not a routing judgement and is recorded here only so it is not forgotten. Released 2026-08-05 alongside Muse Code, a terminal harness with persistent background agents and an append-only event log for restart-safe replay. Hosted only — weights are not downloadable — reached through the Meta Model API with a 1M-token context, tool calling, structured outputs, batching, and prompt caching. Activation needs an independent measurement and a backend probe, in that order: the capability case is weak enough that the probe is not worth running on vendor evidence alone."

