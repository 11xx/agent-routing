# Active delegation surfaces. Skill consumers are declared here; a repository
# owning harness configuration publishes its own source contract through the
# accessor below so moving its tree does not require a second path inventory.

[repository]
skills = "agent-harnesses"
delegate = "agent-delegate"

[[accessor]]
id = "instructions"
command = ["agent-harness", "delegation-sources"]
# The floor the config owns: lint fails when the accessor stops reporting any
# of these, so a harness-side regression cannot shrink what is checked. Sources
# beyond the floor are checked too.
expected_sources = ["settings", "shared-fragments", "pi-fragments", "pi-agents", "pi-subagent"]

# The delegation mechanism is a CLI rather than three skills; what remains
# routing-sensitive is the agent definitions it ships — relay shells and the
# pinned native implementers below — and its own sources, which must name a
# profile and never a concrete model.
[[consumer]]
id = "delegate-agents"
repository = "delegate"
path = "agents"
checks = ["roster-literals", "agent-frontmatter"]

[[consumer]]
id = "delegate-sources"
repository = "delegate"
path = "src"
checks = ["roster-literals"]

# Claude’s static agent frontmatter requires this version-agnostic alias. The
# proxy must remain a relay and therefore keeps the centrally recorded effort.
[[proxy]]
consumer = "delegate-agents"
path = "codex.md"
model = "sonnet"
effort = "low"

[[proxy]]
consumer = "delegate-agents"
path = "pi.md"
model = "sonnet"
effort = "low"

[[proxy]]
consumer = "delegate-agents"
path = "opencode.md"
model = "sonnet"
effort = "low"

# A harness-native agent definition whose frontmatter carries a route the
# roster resolves. Claude reads model and effort from static frontmatter and
# loads definitions only at session start, so the route is pinned in the file
# and recorded here; lint resolves the named profile on the named backend and
# fails when the file's model or effort drifts from what the resolver returns.
# A tier the roster prohibits gets no definition, which is how a ban reaches
# the harness's own subagent tool.
[[pin]]
consumer = "delegate-agents"
path = "implement-opus.md"
model = "opus"
effort = "xhigh"
profile = "implement"
variant = "opus"
backend = "claude"
