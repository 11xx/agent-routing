# Active delegation surfaces. Skill consumers are declared here; a repository
# owning harness configuration publishes its own source contract through the
# accessor below so moving its tree does not require a second path inventory.

[repository]
skills = "ai-agent-harnesses"
delegate = "ai-agent-delegate"

[[accessor]]
id = "instructions"
command = ["agent-harness", "delegation-sources"]

# The delegation mechanism is a CLI rather than three skills; what remains
# routing-sensitive is the proxy agents it ships and its own sources, which
# must name a profile and never a concrete model.
[[consumer]]
id = "delegate-agents"
repository = "delegate"
path = "agents"
checks = ["roster-literals", "agent-frontmatter"]

[[consumer]]
id = "delegate-sources"
repository = "delegate"
path = "src"
checks = ["roster-literals"]

[[consumer]]
id = "plan-for-codex"
repository = "skills"
path = "skills/plan-for-codex"
checks = ["roster-literals", "agent-frontmatter"]

# Claude’s static agent frontmatter requires this version-agnostic alias. The
# proxy must remain a relay and therefore keeps the centrally recorded effort.
[[proxy]]
consumer = "delegate-agents"
path = "codex.md"
model = "sonnet"
effort = "low"

[[proxy]]
consumer = "delegate-agents"
path = "pi.md"
model = "sonnet"
effort = "low"

[[proxy]]
consumer = "delegate-agents"
path = "opencode.md"
model = "sonnet"
effort = "low"
