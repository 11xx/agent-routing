# Named delegation routes. Callers choose a task-shape profile; this table
# deterministically supplies the current provider, model, and effort.
# Access without a path: `agent-routing profiles`.
#
# No profile routes to the OpenCode backend. The provider declares no model
# variants, so effort is unreachable there by any syntax: a model reference
# carrying one is refused with `Variant unavailable`, and the same tiers
# declared through the runtime plugin and through a static provider block both
# failed to reach the resolver. A route that names an effort the backend
# silently drops is a route that lies about what ran, so `agent-delegate`
# refuses one rather than downgrading it — which left every OpenCode route
# here unrunnable. Pi reaches the same models and honours effort, so it
# carries the capacity these variants were offering.
#
# Reinstate them if the provider starts declaring variants: add the variant
# back with `backends = ["opencode"]`, and confirm the effort actually arrives
# by checking that reasoning-token counts move with the lever rather than by
# trusting the flag was accepted. The OpenCode backend also has no
# unattended-approval mode, so a permission prompt ends a non-interactive run
# with exit 0 and no verdict; that limitation is independent of variants and
# has to be solved separately before an unattended route is safe.

[meta]
schema = "routing-profiles/1"
updated = "2026-09-03"

[[profile]]
id = "extract"
purpose = "one fixed-input, fixed-output classification, extraction, aggregation, or bounded summary"
provider = "openai-codex"
model = "gpt-5.6-luna"
effort = "low"
stability = "stable"
# Fixed-shape labor belongs on the much cheaper Luna tiers. Spending the Claude
# window on extraction is a caller-named capacity decision, and this profile
# intentionally offers no route for it.
backends = ["codex", "pi"]

  # Fixed-shape extraction is high-volume enough to spend a separate pool:
  # choose this when the Codex window is the constraint, and keep the primary
  # when that window has capacity. Luna low preserves the bounded-call contract
  # instead of turning a cheap extraction into an agentic trial.
  [[profile.variant]]
  id = "goat"
  provider = "commandcode"
  model = "gpt-5.6-luna"
  effort = "low"
  stability = "stable"
  backends = ["pi"]

[[profile]]
id = "explore"
purpose = "read-only codebase reconnaissance and source mapping without a verdict"
# Reconnaissance is bounded reading rather than judgment, so it takes the same
# workhorse as implementation. Luna's high tier is still probationary, so the
# stable seat is max — which costs less here than the Terra tier it replaces
# and keeps one workhorse across both read and write profiles.
provider = "openai-codex"
model = "gpt-5.6-luna"
effort = "max"
stability = "stable"
backends = ["codex", "pi"]

  # Reconnaissance on the Claude window takes the same Opus medium tier as
  # every other first-party route: medium is the routing ceiling, and low is
  # unrouted absent a measured capacity need.
  [[profile.variant]]
  id = "opus"
  provider = "anthropic"
  model = "opus-5"
  backend_model = "claude-opus-5"
  effort = "medium"
  stability = "stable"
  backends = ["claude"]
  default_for_backend = true

[[profile]]
id = "implement"
purpose = "bounded production work whose targets and acceptance probes are already named"
# Terra held this seat until Luna's price reset. Luna max measures 67% at
# $0.61 a task where Terra high costs several times that for a comparable
# tier, and a full day of delegated implementation went to Luna without once
# reaching for Terra.
provider = "openai-codex"
model = "gpt-5.6-luna"
effort = "max"
stability = "stable"
backends = ["codex", "pi"]

  # The first-party Claude subscription has one production implementation
  # tier in this model era. Opus medium is the backend default; low rarely
  # saves enough window to justify replacing the much cheaper Luna workhorse.
  [[profile.variant]]
  id = "opus"
  provider = "anthropic"
  model = "opus-5"
  backend_model = "claude-opus-5"
  effort = "medium"
  stability = "stable"
  backends = ["claude"]
  default_for_backend = true

  # Sol at low is the most output-token-efficient row on the board, and the
  # only reason to spend the Codex window on it below Luna max is that
  # efficiency: a small, fully specified slice whose result a person reads,
  # where Luna's 73k-token habit is the cost. Never a default — a caller
  # names it, and the roster row says why that is rarely the right call.
  [[profile.variant]]
  id = "sol-low"
  provider = "openai-codex"
  model = "gpt-5.6-sol"
  effort = "low"
  stability = "stable"
  backends = ["codex", "pi"]

  # The cheap lane off a third subscription: GLM 5.3 Flash matches Luna in
  # taste and capability and costs a fraction, and neither draws the Claude
  # window or the Codex schedule. Pi reaches it; provider stays explicit
  # because the model name is authenticated on more than one. The roster id
  # is the vendor-less `glm-5.3-flash`, which pi resolves as a pattern against
  # its own `z-ai/glm-5.3-flash` — probed, so no id translation is needed.
  [[profile.variant]]
  id = "goat-glm"
  provider = "commandcode"
  model = "glm-5.3-flash"
  effort = "high"
  stability = "stable"
  backends = ["pi"]

  # Luna max off the GOAT subscription, for a slice whose brief is tight
  # enough that literal instruction-following is the deciding trait.
  [[profile.variant]]
  id = "goat"
  provider = "commandcode"
  model = "gpt-5.6-luna"
  effort = "max"
  stability = "stable"
  backends = ["pi"]

[[profile]]
id = "generate"
purpose = "high-volume or heavily steered candidate generation whose output is raw material rather than a deliverable: drafts to mine, options to sweep, defect candidates to adjudicate. Everything it returns is unverified until a lead or reviewer-tier model checks it against source, and nothing resolved here is the last model to touch shipped work"
provider = "deepseek"
model = "deepseek-v4-flash"
effort = "max"
stability = "experimental"
# This profile reaches DeepSeek's independent pool as a steered generator and
# is closed to every other backend by design.
backends = ["pi"]

[[profile]]
id = "interactive"
purpose = "default interactive Pi parent session before a task-specific child route is selected"
provider = "openai-codex"
model = "gpt-5.6-sol"
effort = "medium"
stability = "stable"
# This is a Pi-only shape: the profile names the one backend whose interactive
# session contract it was measured against.
backends = ["pi"]

[[profile]]
id = "plan"
purpose = "read-only technical planning where feasibility, failure modes, and ordered execution are the work"
provider = "openai-codex"
model = "gpt-5.6-sol"
effort = "high"
stability = "stable"
# Planning is the head model's own seat. A Claude lead gains only a second
# context by delegating to the same window; a lead on another harness uses Sol.
backends = ["codex", "pi"]

[[profile]]
id = "execute"
purpose = "broad or multi-slice implementation where technical judgment and long-horizon persistence remain material"
provider = "openai-codex"
model = "gpt-5.6-sol"
effort = "high"
stability = "stable"
backends = ["codex", "pi"]

  [[profile.variant]]
  id = "opus"
  provider = "anthropic"
  model = "opus-5"
  backend_model = "claude-opus-5"
  effort = "medium"
  stability = "stable"
  backends = ["claude"]
  default_for_backend = true

[[profile]]
id = "review"
purpose = "read-only correctness and regression review of a bounded behavior-affecting change"
provider = "openai-codex"
model = "gpt-5.6-luna"
effort = "max"
stability = "stable"
backends = ["codex", "pi"]

  # Review is the one profile where Luna max's cost shape is the right trade:
  # nobody waits on a read-only pass, so 2.8x the steps buy thoroughness, and it
  # scores 6 points over the Sol medium tier it replaces at a third of the cost.
  # This is the first gate and its verdict discharges review; the named Sol
  # variants are exceptions — a waiting verdict, or a second pass where a wrong
  # approval is expensive. The Claude variant is the cross-provider path for
  # GPT-authored diffs.

  # GPT-authored diffs need a reviewer outside the Codex pool. Keep the roster
  # id separate from the first-party Claude client id so the route records both
  # the policy model and the callable backend model.
  [[profile.variant]]
  id = "opus"
  provider = "anthropic"
  model = "opus-5"
  backend_model = "claude-opus-5"
  effort = "medium"
  stability = "stable"
  backends = ["claude"]
  default_for_backend = true

  # When the verdict is on the critical path. Sol medium answers in a fraction
  # of Luna max's 20-40 minutes on a large diff.
  [[profile.variant]]
  id = "fast"
  provider = "openai-codex"
  model = "gpt-5.6-sol"
  effort = "medium"
  stability = "stable"
  backends = ["codex", "pi"]

  [[profile.variant]]
  id = "high-stakes"
  provider = "openai-codex"
  model = "gpt-5.6-sol"
  effort = "high"
  stability = "stable"
  backends = ["codex", "pi"]

  # Luna max off the GOAT subscription instead of the Codex window, while that
  # pool is open. Its allowance is smaller than the Codex schedule and carries
  # a weekly limit as well as a five-hour one, so this is complementary
  # capacity to take when available rather than a lane to plan a sweep around.
  # Same model and effort,
  # a third pool, and pi is the only backend that reaches it. Max effort is
  # genuinely applied here rather than clamped: the provider catalog maps the
  # extended levels explicitly, verified by reasoning-token counts moving with
  # the lever.
  [[profile.variant]]
  id = "goat"
  provider = "commandcode"
  model = "gpt-5.6-luna"
  effort = "max"
  stability = "stable"
  backends = ["pi"]

  # The cheap lane's other half, as a reviewer. It argues rather than
  # complying, which is the trait a review wants, and it draws the same third
  # subscription — so a review and the implementation it judges can run on one
  # pool without either touching a standing window. Never route it onto work
  # it authored: the pairing is that each reviews the other.
  [[profile.variant]]
  id = "goat-glm"
  provider = "commandcode"
  model = "glm-5.3-flash"
  effort = "high"
  stability = "stable"
  backends = ["pi"]

