# Named delegation routes. Callers choose a task-shape profile; this table
# deterministically supplies the current provider, model, and effort.
# Access without a path: `agent-routing profiles`.

[meta]
schema = "routing-profiles/1"
updated = "2026-08-02"

[[profile]]
id = "extract"
purpose = "one fixed-input, fixed-output classification, extraction, aggregation, or bounded summary"
provider = "openai-codex"
model = "gpt-5.6-luna"
effort = "low"
stability = "stable"
backends = ["codex", "pi"]

  [[profile.variant]]
  id = "opencode-go"
  provider = "opencode-go"
  model = "gpt-5.6-luna"
  effort = "low"
  stability = "experimental"
  backends = ["opencode"]

  # Fixed-shape extraction is high-volume enough to spend a separate pool:
  # choose this when the Codex window is the constraint, and keep the primary
  # when that window has capacity. Luna low preserves the bounded-call contract
  # instead of turning a cheap extraction into an agentic trial.
  [[profile.variant]]
  id = "goat"
  provider = "commandcode"
  model = "gpt-5.6-luna"
  effort = "low"
  stability = "stable"
  backends = ["pi"]

[[profile]]
id = "explore"
purpose = "read-only codebase reconnaissance and source mapping without a verdict"
provider = "openai-codex"
model = "gpt-5.6-terra"
effort = "high"
stability = "stable"
backends = ["codex", "pi"]

[[profile]]
id = "implement"
purpose = "bounded production work whose targets and acceptance probes are already named"
provider = "openai-codex"
model = "gpt-5.6-terra"
effort = "high"
stability = "stable"
backends = ["codex", "pi"]

  [[profile.variant]]
  id = "luna-trial"
  provider = "openai-codex"
  model = "gpt-5.6-luna"
  effort = "max"
  stability = "experimental"
  backends = ["codex", "pi"]

  [[profile.variant]]
  id = "opencode-go-trial"
  provider = "opencode-go"
  model = "gpt-5.6-luna"
  effort = "max"
  stability = "experimental"
  backends = ["opencode"]

  # The cheap lane off a third subscription: GLM 5.3 Flash matches Luna in
  # taste and capability and costs a fraction, and neither draws the Claude
  # window or the Codex schedule. Pi reaches it; provider stays explicit
  # because the model name is authenticated on more than one. The roster id
  # is the vendor-less `glm-5.3-flash`, which pi resolves as a pattern against
  # its own `z-ai/glm-5.3-flash` — probed, so no id translation is needed.
  [[profile.variant]]
  id = "goat-glm"
  provider = "commandcode"
  model = "glm-5.3-flash"
  effort = "high"
  stability = "stable"
  backends = ["pi"]

  # Luna max off the GOAT subscription, for a slice whose brief is tight
  # enough that literal instruction-following is the deciding trait.
  [[profile.variant]]
  id = "goat"
  provider = "commandcode"
  model = "gpt-5.6-luna"
  effort = "max"
  stability = "stable"
  backends = ["pi"]

[[profile]]
id = "generate"
purpose = "high-volume or heavily steered candidate generation whose output is raw material rather than a deliverable: drafts to mine, options to sweep, defect candidates to adjudicate. Everything it returns is unverified until a lead or reviewer-tier model checks it against source, and nothing resolved here is the last model to touch shipped work"
provider = "deepseek"
model = "deepseek-v4-flash"
effort = "max"
stability = "experimental"
backends = ["pi"]

[[profile]]
id = "interactive"
purpose = "default interactive Pi parent session before a task-specific child route is selected"
provider = "openai-codex"
model = "gpt-5.6-sol"
effort = "medium"
stability = "stable"
backends = ["pi"]

[[profile]]
id = "plan"
purpose = "read-only technical planning where feasibility, failure modes, and ordered execution are the work"
provider = "openai-codex"
model = "gpt-5.6-sol"
effort = "high"
stability = "stable"
backends = ["codex", "pi"]

[[profile]]
id = "execute"
purpose = "broad or multi-slice implementation where technical judgment and long-horizon persistence remain material"
provider = "openai-codex"
model = "gpt-5.6-sol"
effort = "high"
stability = "stable"
backends = ["codex", "pi"]

[[profile]]
id = "review"
purpose = "read-only correctness and regression review of a bounded behavior-affecting change"
provider = "openai-codex"
model = "gpt-5.6-luna"
effort = "max"
stability = "stable"
backends = ["codex", "pi"]

  # Review is the one profile where Luna max's cost shape is the right trade:
  # nobody waits on a read-only pass, so 2.8x the steps buy thoroughness, and it
  # scores 6 points over the Sol medium tier it replaces at a third of the cost.
  # This is the first gate and its verdict discharges review; the two Sol
  # variants are named exceptions — a waiting verdict, or a second pass where a
  # wrong approval is expensive.

  # When the verdict is on the critical path. Sol medium answers in a fraction
  # of Luna max's 20-40 minutes on a large diff.
  [[profile.variant]]
  id = "fast"
  provider = "openai-codex"
  model = "gpt-5.6-sol"
  effort = "medium"
  stability = "stable"
  backends = ["codex", "pi"]

  [[profile.variant]]
  id = "high-stakes"
  provider = "openai-codex"
  model = "gpt-5.6-sol"
  effort = "high"
  stability = "stable"
  backends = ["codex", "pi"]

  # The same model off both standing windows, for when capacity rather than
  # capability is the constraint. Experimental because the pool is: opencode has
  # no unattended-approval mode, so a permission prompt ends a non-interactive
  # run with exit 0 and no verdict.
  [[profile.variant]]
  id = "opencode-go"
  provider = "opencode-go"
  model = "gpt-5.6-luna"
  effort = "max"
  stability = "experimental"
  backends = ["opencode"]

  # Luna max off the GOAT subscription instead of the Codex window, when
  # capacity rather than capability is the constraint. Same model and effort,
  # a third pool, and pi is the only backend that reaches it. Max effort is
  # genuinely applied here rather than clamped: the provider catalog maps the
  # extended levels explicitly, verified by reasoning-token counts moving with
  # the lever.
  [[profile.variant]]
  id = "goat"
  provider = "commandcode"
  model = "gpt-5.6-luna"
  effort = "max"
  stability = "stable"
  backends = ["pi"]

  # Sol high off the third subscription, for a verdict that must come from
  # neither the model that wrote the diff nor the one that repaired it. The
  # effort lever is real here: the GOAT catalog now declares Sol a reasoning
  # model, measured by reasoning tokens moving with the level.
  [[profile.variant]]
  id = "goat-sol"
  provider = "commandcode"
  model = "gpt-5.6-sol"
  effort = "high"
  stability = "stable"
  backends = ["pi"]

  # The cheap lane's other half, as a reviewer. It argues rather than
  # complying, which is the trait a review wants, and it draws the same third
  # subscription — so a review and the implementation it judges can run on one
  # pool without either touching a standing window. Never route it onto work
  # it authored: the pairing is that each reviews the other.
  [[profile.variant]]
  id = "goat-glm"
  provider = "commandcode"
  model = "glm-5.3-flash"
  effort = "high"
  stability = "stable"
  backends = ["pi"]

[[profile]]
id = "design"
purpose = "read-only judgment on UX, copy, API ergonomics, or architectural simplicity"
provider = "anthropic"
model = "opus-5"
backend_model = "claude-opus-5"
effort = "medium"
stability = "stable"
backends = ["claude"]
