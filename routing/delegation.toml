# Delegation mechanism matrix: machine-readable source of truth.
# Prose view: ~/code/arc/DELEGATION.md (canonical prose for mechanism
# routing). Model/effort selection lives in models.toml, not here.
# Access without a path: `agent-routing delegation`.
# `harness` field marks harness-specific rows; omit = shared policy.

[meta]
updated = "2026-10-09"
golden_rule = "never tell an executor to delegate to itself"

[[route]]
actor = "claude"
task = "plan an arc chain"
mechanism = "arc JSON export + detailed journal spec"
rules = "make dependencies and ownership explicit; generated executor prompts stop before review, merge, or integration"

[[route]]
actor = "claude"
task = "delegate implementation to codex"
mechanism = "agent-delegate against an Arc change or bounded range; claude itself may run the resolved codex exec mechanism"
rules = "executor commands appear only in instructions claude will run; Arc owns the brief, provenance, rounds, debt, review choice, and integration record; never ask the codex executor to delegate again"

[[route]]
actor = "claude"
task = "review and merge"
mechanism = "review base..head, record verdict, arc integrate when gates pass"
rules = "inspect delegated work directly; use independent review only when policy, the user, or consequence requires it; record routine deferred coverage as Arc debt; never let debt override changes-requested"

[[route]]
actor = "lead"
task = "select a reviewer"
mechanism = "stakes-based reviewer line (full policy: models.toml [policy].review)"
rules = "do not call self-review independent; a lead may review delegated work it did not author; use independent review only when policy, the user, or consequence requires it; record routine deferred coverage as Arc debt; reviewer tiers remain stakes-based, and debt never overrides changes-requested"

[[route]]
actor = "codex"
task = "execute a local arc"
mechanism = "read journal spec and work in assigned worktree; import bundle only when sandbox and Arc store permit writes, otherwise lead imports it and provides the spec"
rules = "under `read-only`, inspect and report; under `workspace-write`, implement and verify, then leave the diff for the lead to commit and snapshot; under full access, implement, verify, and commit, then snapshot only when the Arc store is writable, otherwise the lead snapshots before review. In every mode, no codex exec, no delegation, no merge, no integrate"

[[route]]
actor = "codex"
task = "orchestrate sub-codex work"
mechanism = "codex exec with a self-contained plan"
rules = "only when the prompt explicitly assigns codex the orchestrator role; preserve the lead's review and merge boundary"

[[route]]
actor = "arc-skill"
task = "coordinate a chain"
mechanism = "arc CLI ledger: worktrees, blockers, snapshots, gates, reviews, integration checks"
rules = "one writer per branch/worktree; local-only executor prompts; the lead owns dependency order and integration"

[[rule]]
id = "native-subagent-fence"
policy = "do not route work through harness-native subagent defaults; invoke executors explicitly with stated model, effort, and a curated self-contained brief"
why = "Codex 5.6 native subagents inherit the full conversation plus the parent's model family and reasoning level: the ladder deliberately routes fixed-shape calls to Luna low/medium, bounded implementation to Luna max, and lead judgment to Sol high, while whole-conversation inheritance is unscoped context transfer"
revisit = "if a harness ships reliable per-subagent model/effort/context controls"

[[rule]]
id = "executor-write-fence"
policy = "every implementation prompt routed below the Sol-xhigh floor names exact targets, a scope ceiling, no extra tests or refactors, and abort conditions. Every Sol write-mode prompt keeps the same fence at all efforts. If a named target or prerequisite is absent, stop and report rather than substituting another target or working around it"
why = "A cheap executor is safe only when the lead makes scope and failure loud. Sol adds a field-measured persistence risk: ambiguity can become overbuild or destructive literal goal completion"

[[rule]]
id = "acceptance-probes"
policy = "every implementation brief routed below the Sol-xhigh floor names acceptance probes as runnable commands that discriminate its material risks; the executor runs each at the final head when its sandbox permits execution and records it with `arc verify --command` only when both the sandbox and Arc store permit that write. If the sandbox or store prevents execution or recording, the executor reports the probe and result for the lead to run or record. A brief whose material risk has no such command is not ready to delegate — resolve it or escalate the tier. If no authorized actor can run a required probe, the executor stops and asks for a new brief rather than skipping it"
why = "gates catch compile, regression, and lint failures, and diff review catches overbuild; neither sees a plausible implementation of the wrong semantics, which is the one failure mode that stays green. A named probe converts that from a tier problem into a specification problem"
caveat = "readiness consults declared gates only, so probe evidence is recorded and reviewable but never gating; this convention is enforced by the reviewer, not by the tool"

[[rule]]
id = "brief-premise-verification"
policy = "the lead opens every path and symbol a brief names and verifies each premise against source before delegating; a brief asserting something untrue about the code is the lead's defect, not the executor's"
why = "measured on the rescue chain: three of six first attempts blocked on unverified brief claims, and all four review-stopping findings were faithful implementations of incomplete briefs rather than execution errors, so no executor tier would have prevented them. Those findings were major and rode changes-requested verdicts; their structured blocking field was false, so the stop was the verdict's, not the finding's"

[[rule]]
id = "preferred-patterns"
policy = "prefer programmatic orchestration (one-off script encoding per-agent prompt/model/effort/context and control flow as code) or an arc chain (ledger-backed dependency order, curated specs, machine-checked gates) over implicit inheritance"

[[rule]]
id = "proxy-shells"
harness = "claude-code"
policy = "backend proxy shells (codex and pi agent types) stay at sonnet low; they relay the exact command and result, never perform or redesign the delegated task; labels use cx- for codex-backed spawns and pi- for pi-backed spawns"

[[rule]]
id = "luna-invocation"
harness = "codex"
policy = "resolve the extract profile for fixed-shape calls and the stable implement profile for bounded production work; do not pin a Luna model id or assume native mixed-model subagents"

[[rule]]
id = "deepseek-invocation"
harness = "pi"
policy = "V4.1 Flash is pi's default for every GPT profile, reached on the Go pool as `--provider opencode-go --model deepseek-v4.1-flash` through each profile's deepseek-go variant, and the steered generator on the same pool through the `generate` profile. Brief it fully — exact targets, a scope ceiling, named acceptance probes — and check every identifier it emits against source, because the predecessor build fabricated confidently rather than visibly."
why = "five field arcs on the build in service measured implementation work without a fabricated identifier in anything a lead probed, and the operator directed pi's defaults onto it; the identifier check is what the predecessor's record still buys"


[[rule]]
id = "mimo-probation-invocation"
harness = "pi"
policy = "select the MiMo rows by operator direction only — `agent-routing validate --profile <shape> --backend pi --model mimo-v2.6-flash --effort high --provider opencode-go --reason <text> --allow-experimental` — and run them through pi as `--provider opencode-go --model mimo-v2.6-flash` or `--model mimo-v2.6-pro`. No profile resolves to either row and nothing degrades to them. The pair's preference is open; Pro is its sibling, read as a little stronger at about three times the input, and carried for the trial that wants it. Both are unmeasured: a fully specified brief with exact targets, a scope ceiling, acceptance probes, and lead review; every claim and identifier a candidate until checked against source; never the last model to touch shipped work. A trial's result is what moves a row, and the result is recorded against the selection that produced it"
why = "the rows hold the probation footing deepseek-flash held before its field arcs, with none of its evidence, so the selection path has to carry the record: validate names the profile shape, model, effort, pool, and reason against the route version, which is what a later trial is read against"

[[rule]]
id = "sonnet-5-5-trial-invocation"
harness = "claude"
policy = "select Sonnet 5.5 by operator direction only — `agent-routing validate --profile <shape> --backend claude --model sonnet-5.5 --effort <tier> --provider anthropic --reason <text> --allow-experimental` — and run it as `claude -p --model claude-sonnet-5-5 --effort <tier>`. No profile resolves to it and nothing degrades to it. Low, xhigh, and max are explicit-only, and max is a bounded trial under a token or time cap, never an escalation; medium and high are the trial tiers, and the first comparison is high against Opus 5.5 medium on the same real work. Brief it as any delegated slice — exact targets, a scope ceiling, acceptance probes, lead review — and record the model, the requested and the effective effort, the harness, and the evaluator with the result, because a score without them cannot be compared. Watch for subagent fan-out, out-of-scope edits, and timeouts, the failure shape its highest tier showed. A trial's result is what moves a tier, and it is recorded against the selection that produced it"
why = "an unmeasured model is reached by a deliberate selection so probation ends on an attributable arc, not on whatever a profile happened to resolve; Sonnet 5's dominated record says nothing about this build, which is why it is tried instead of assumed either way"

[[rule]]
id = "sandboxed-executors"
harness = "codex"
policy = "Under Codex `workspace-write`, every writable root's `.git` and a linked worktree's git dir (`<common>/worktrees/<name>`) remain read-only; a root added with `--add-dir` gets the same carve-out. Adding the common dir keeps objects, refs, and the default Arc store writable, but the worktree index and HEAD stay read-only, so the executor leaves its diff for the lead to commit and snapshot. Arc bundle imports, claims, stages, verification records, and snapshots require a writable Arc store; the lead performs any such write the sandbox or store prevents. Under `read-only`, the executor inspects and reports; under full access, it follows its authorized commit and snapshot workflow when the Arc store is writable"
why = "Codex 0.159.1 keeps Git metadata read-only in `workspace-write`, including linked-worktree metadata, so an executor in that sandbox cannot stage or commit its diff"

[[rule]]
id = "launcher-stdin-hygiene"
harness = "codex"
policy = "codex exec gets exactly one prompt source: prompt-as-argument requires < /dev/null on stdin; prompt-via-stdin means a single dedicated heredoc; an executor launch never shares a compound command with another stdin consumer or producer"
why = "codex exec appends piped stdin to the prompt and blocks until EOF; a heredoc earlier in the compound command left the pipe open and the executor hung silently (2026-07-17 stall postmortem)"

[[rule]]
id = "launch-watchdogs"
policy = "arm two watchdog tiers on every non-interactive executor launch: first-output within ~60s (near-empty log = launch failure, kill and relaunch) and log-growth progress checks (frozen log = wedge, inspect interim output); never idle on the assumption that a live process is a working one"

[[rule]]
id = "executor-start-breadcrumb"
policy = "arc executors leave a start breadcrumb (arc comment: executor started, session id) right after reading the spec, so the ledger shows life between begin and first snapshot; convention until claim/heartbeat ships"

# Executor backends: CLIs a lead drives programmatically. Prose contract and
# probe checklist: DELEGATION.md "Executor backends (harness adapters)".
# status = "verified" (probed, routable) | "unprobed" (do not select).

# supported_efforts records the backend's common supported levels. A canonical
# model's model_efforts list replaces that set when its catalog mapping differs.
# Empty lists refuse every effort; opt-ins cannot waive these capabilities.
# Pi's declared catalog supports Sol through high and maps DeepSeek's max.
# OpenCode's delegated v2 provider declares no effort variants.

[[backend]]
id = "codex"
supported_efforts = ["low", "medium", "high", "xhigh", "max"]
status = "verified"
providers = ["openai-codex"]
entrypoint = "codex exec \"<prompt>\""
model_flag = "-m gpt-6-{luna,astra} | gpt-6.1-sol"
effort_flag = "-c model_reasoning_effort=\"low|medium|high|xhigh|max\""
workdir_flag = "-C <dir>"
capture = "-o <file>; stdout is the full transcript (noisy)"
isolation = "OS sandbox, which agent-delegate opens to -s danger-full-access by default; -s read-only | -s workspace-write (+ sandbox_workspace_write.writable_roots) narrows a run"
resume = "codex exec resume --last"
quota_pool = "chatgpt-codex-subscription"
default_for = "all GPT delegation"

[[backend]]
id = "pi"
supported_efforts = ["low", "medium", "high"]
model_efforts = { "deepseek-flash" = ["max"] }
status = "verified"
providers = ["openai-codex", "deepseek", "opencode-go"]
version_probed = "0.84.3 (2026-08-29)"
entrypoint = "pi -p \"<prompt>\" (also @file args to inline specs)"
model_flag = "GPT: --provider openai-codex --model gpt-6-{luna,astra} or gpt-6.1-sol; DeepSeek: --provider opencode-go --model deepseek-v4.1-flash on the Go pool, or --provider deepseek --model deepseek-flash on DeepSeek's own billing; MiMo trial: --provider opencode-go --model mimo-v2.6-flash or mimo-v2.6-pro. --provider is never optional: a model name authenticated on two providers aborts the run"
effort_flag = "--thinking off|minimal|low|medium|high|xhigh|max (or :level model suffix). xhigh and max reach the provider only when the model definition maps them; an unmapped model drops both from its supported set and clamps a requested max to high without reporting it"
workdir_flag = "none; cd first"
capture = "stdout is exactly the final message"
isolation = "NONE; every run has unsandboxed user access; read-only is an appended system-prompt instruction, never a tool allowlist"
clean_room = "--no-session --no-extensions --no-skills --no-context-files"
resume = "--session <id> | -c | --fork"
quota_pool = "provider-dependent, and the pairing of model to pool is policy rather than preference. openai-codex shares the codex CLI's ChatGPT subscription and is not a quota fallback; deepseek uses separate API billing; opencode-go draws the Go subscription, metered in usage dollars, and it is where pi's default DeepSeek route and the MiMo rows are selected. Route GPT and Claude models through the subscription that already pays for them, which pi reaches with the same OpenAI or Anthropic login"
default_for = "every GPT profile on pi, through its deepseek-go variant on the Go pool; provider-plural clean-room delegation, leads without codex access, and the MiMo probation trials. GPT write mode only when codex CLI itself is the blocker, and only in a dedicated worktree"

[[backend]]
id = "claude"
supported_efforts = ["low", "medium", "high", "xhigh", "max"]
status = "verified"
providers = ["anthropic"]
entrypoint = "claude -p \"<prompt>\""
model_flag = "--model claude-opus-5-5; claude-fable-5-1 and claude-sonnet-5-5 are operator-directed candidates on this login; claude-haiku-5-5 is the stable `explore` and `extract` seat at high on this backend; no automatic profile names the others"
effort_flag = "--effort low|medium|high|xhigh|max; standing Opus routes resolve xhigh"
workdir_flag = "none; cd first"
capture = "--output-format stream-json --verbose; retain the final result as the report"
isolation = "no OS sandbox: every delegated run uses bypassPermissions in an explicit repository; read-only is an appended instruction, never plan mode or a tool allowlist"
resume = "--resume <session-id>; fork adds --fork-session"
quota_pool = "claude-subscription"
default_for = "Haiku 5.5 high read-only reconnaissance and extraction; Opus 5.5 xhigh implementation, execution, review, taste, UX, copy, API ergonomics, and landing quality through the first-party Claude client"

[[backend]]
id = "opencode"
supported_efforts = []
status = "verified"
providers = ["opencode-go"]
version_probed = "1.18.10 (2026-08-01)"
requires = "an active OpenCode Go subscription. Probed status describes the CLI contract, not the pool: confirm `opencode auth list` shows OpenCode Go before routing, and treat an absent credential as a stop rather than a fallback to another pool"
entrypoint = "opencode run \"<prompt>\" — this row describes the v1 CLI at the probed version. agent-delegate drives `opencode2`, whose provider declares no model variants, so the effort row below does not transfer to it"
model_flag = "-m opencode-go/<model>"
effort_flag = "--variant low|high|max on v1 — HONORED BUT UNVALIDATED: a misspelled or unsupported value is silently accepted and falls back to the default effort rather than erroring. Confirm the tier took by reading `reasoning` in the --format json token counts (max reported 30 reasoning tokens where low and a nonsense value both reported 0)"
workdir_flag = "--dir <dir> on v1; v2 has no such flag and the child runs in the caller's directory"
capture = "on v1, stdout is the final message under a `> build · <model>` header and --format json emits a JSONL event stream carrying per-step token counts; v2 capture is unmeasured"
isolation = "NONE. On v1, permission config plus --auto auto-approves everything not explicitly denied. v2 has no unattended-approval mode, so a permission prompt ends a non-interactive run at exit 0 with no verdict"
clean_room = "on v1, --pure drops external plugins only; AGENTS.md and ~/.config/opencode/skills still load, so a delegated call pays that prefix on every launch"
resume = "-c | -s <session-id> | --fork on v1; v2 uses --session <id> and --session <id> --fork"
quota_pool = "opencode-go subscription: an independent third pool drawing on neither the Claude window nor the Codex credit schedule"
default_for = "nothing: no profile routes to the opencode backend. Pi reaches the same Go pool with working effort, and pi's profile defaults resolve there"
notes = "pi 0.99.1's bundled opencode-go catalog lists both gpt-5.6-luna and gpt-6-luna. Catalog presence describes client model metadata; profile seats and pool eligibility remain defined by this routing manifest"

[[rule]]
id = "opencode-go-availability"
harness = "opencode"
policy = "the Go pool carries pi's default route for every GPT profile, so a lapsed subscription or a disabled data-residency opt-in fails those pi runs rather than degrading them; the work moves to codex or claude, which serve the same profiles. Nothing falls back to the pool from another window when that window runs out"
why = "the pool is an optional $10/month subscription, unlike the two standing ones. Treating it as always-present would make routing depend on a payment state the manifests cannot observe"

[[rule]]
id = "opencode-go-invocation"
harness = "opencode"
policy = "capability rows transfer from the roster because the model is identical — opencode-go/gpt-5.6-luna is the same gpt-5.6-luna measured on the matrix — while cost and quota accounting do not: Go meters usage dollars ($12 per five hours, $30 weekly, $60 monthly) rather than credits. Several Go models are hosted in China and run only while the workspace's data-residency opt-in is on; switched off, they refuse, as `deepseek-v4-flash` did on 2026-08-01, and with it on they route normally, as `deepseek-v4.1-flash` did on 2026-09-22. The setting is the operator's, and delegating to one sends repository context there, so the roster records it rather than gating on it. This repository does not hold a table of acceptable retention postures: what a route can do belongs here, what posture its owner will accept does not. Exit status is honest (1 on model error), but the default prefix is heavy — a bare prompt wrote 16.3k cache tokens — so fence context aggressively on a dollar-metered window"
why = "measured live on 2026-08-01: gpt-5.6-luna returned on the first call, `deepseek-v4-flash` refused with a China-hosting opt-in requirement, and --format json reported the per-step token accounting that makes the dollar window locally measurable"

[[rule]]
id = "quota-bidirectional"
policy = "usage-limit errors are routine: report and fall back to the other subscription or wait for the stated reset; never retry-loop; hand off mid-arc via the handoff skills"

# Which models a pool may serve. A subscription is priced for a tier, and a
# route that ignores that spends an allowance on work another subscription has
# already paid for — measured on 2026-08-29, when five Sol-high passes through
# the GOAT plan took its five-hour and then its weekly limit inside a day while
# the identical work continued on the Codex window. `serves` is the closed set
# of models a pool may be routed to; `pays_for` names where the models it
# refuses belong, so a refusal can say what to do instead. Providers absent
# from this table are unconstrained.
[[pool]]
provider = "opencode-go"
plan = "OpenCode Go, an optional flat subscription"
serves = ["gpt-5.6-luna", "gpt-6-luna", "glm-5.3-flash", "mimo-v2.6-flash", "mimo-v2.6-pro", "deepseek-flash"]
pays_for = "openai-codex for the GPT frontier tiers, anthropic for the Claude models"
why = "a dollar-metered small plan whose value is cheap-tier capacity off both standing windows, not a cheaper way to buy a frontier tier"

[[pool]]
provider = "openai-codex"
plan = "the Codex subscription"
serves = ["gpt-5.6-sol", "gpt-5.6-luna", "gpt-6-astra", "gpt-6.1-sol", "gpt-6-sol", "gpt-6-luna"]
pays_for = "itself: Sol runs here and nowhere else"
why = "Sol belongs to the subscription that already covers it. pi and opencode reach it with the same OpenAI login, so the backend is never a reason to route Sol elsewhere"

[[pool]]
provider = "anthropic"
plan = "the Claude subscription"
serves = ["opus-5.5", "fable-5.1", "sonnet-5.5", "haiku-5.5"]
pays_for = "itself: never reach a Claude model through metered credits when the subscription covers it"
why = "the same rule as Sol, on the other window"
